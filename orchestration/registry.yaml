  - name: portfolio_layer
    db_group: portfolio
    dependency_tier: 1                  # runs only after the Tier-0 gate passes
    required: true
    network: true
    entry_script: portfolio_layer/orchestration/18_run_portfolio_pipeline.py
    date_flag: "--as-of"                # NOTE: hyphenated, unlike sectors' --asof
    args_template: ["--as-of", "{date}"]
    force_args: ["--force"]
    # Publish/health must gate on END-of-run artifacts, not Stage-1 outputs:
    # stocks_scores.csv + manifest.json[hard_gate_acceptance] exist minutes into a
    # run, so a run dying after scores used to count as published+healthy and was
    # never re-run. final/final_manifest.json is written only by the last step
    # (final_report/21), and orchestration_meta.json["acceptance"] is 18's
    # whole-run verdict (PASS_WITH_ADVISORY_WARNINGS = advisory-only soft fails).
    publish_glob: "portfolio_layer/output/runs/{date}/final/final_manifest.json"
    publish_date_format: "%Y-%m-%d"
    # Publish-convention epoch (2026-08-07): final/final_manifest.json is written only
    # by runs since 2026-07-02 (verified: earliest final_manifest.json on disk).
    # ~1,900 older run dirs sealed under the previous convention must never be
    # re-classified as missing when this glob changes -- pre-epoch dates are exempt
    # from catch-up missing-detection. Bump this date whenever publish_glob is
    # repointed to an artifact that older runs do not have.
    publish_epoch: "2026-07-02"
    oos_column: null
    staleness_tolerance_days: 10
    # 12h = 2x the 6h default. Derivation: 18's configured per-step budgets sum to
    # ~19h absolute worst case (strategic cadence: ~50 steps x step_timeout_sec
    # 1800 plus the 7200s macro + monitor ceilings), but that ceiling is only
    # reachable if nearly every step hangs to its own timeout; a healthy strategic
    # run completes in a small fraction of 12h. 43200 lets 18 absorb several
    # step-level timeouts and still persist its own terminal FAIL meta instead of
    # being killed mid-run by the master at the 6h default.
    timeout_sec: 43200
    health:
      manifest: "portfolio_layer/output/runs/{date}/orchestration_meta.json"
      status_keys: ["acceptance"]
      healthy_values:
        ["PASS", "PASS_WITH_ADVISORY_WARNINGS", "PASS_WITH_DEFERRED"]
    # Portfolio has no native per-date backfill entry. In --mode backfill the
    # orchestrator records a NOTE that research/65 snapshot capture is the
    # intended path and does NOT auto-run the stage11 chain.
    backfill:
      script: ""
      args_template: []
      per_date: false
      note: "portfolio_layer stage11/research chain is NOT auto-run; capture snapshots via portfolio_layer research/65 manually."
    repair: null
    # Surveillance-only: age of the two portfolio-side upstream stores nothing
    # else watches (publish-artifact staleness covers only the published runs).
    freshness_probes:
      - name: macro_serving_age
        kind: sqlite_max_date
