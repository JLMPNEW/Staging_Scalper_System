      short_term_borrowings:
        concepts: [ShortTermBorrowings, CurrentBorrowings]
      current_maturities:
        concepts: [LongTermDebtCurrent, LongTermDebtAndFinanceLeaseObligationsCurrent]
  debt_noncurrent:
