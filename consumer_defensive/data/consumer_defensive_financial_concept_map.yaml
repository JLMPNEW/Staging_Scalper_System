    components:
      long_term_debt:
        concepts: [LongTermDebtNoncurrent, LongTermDebtAndFinanceLeaseObligationsNoncurrent, NoncurrentBorrowings]
  depreciation_amortization:
    statement_type: cash_flow
    concepts: [DepreciationDepletionAndAmortization, DepreciationAndAmortisationExpense]
  income_tax_expense:
    statement_type: income
    concepts: [IncomeTaxExpenseBenefit, IncomeTaxExpense]
  pretax_income:
    statement_type: income
    concepts: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, ProfitLossBeforeTax]
