paths:
  # SC-18: env-var fallback pattern is "${ENV_VAR:-machine_default}". The value after
  # ":-" is machine-specific; set the env var when running on another host so a fresh
  # empty DB is not silently created under a wrong path.
  database_path: "${INDUSTRIALS_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/industrials.sqlite"
  # CF-6: removed dead keys output_dir/cache_dir (no reader). Outputs and caches are
  # controlled per stage: *.output_csv and *.cache_dir keys below.

runtime:
  # CF-10: this config value is authoritative. Several scripts still carry an in-code
  # default of 30.0 for this key; never rely on the in-code default.
  sqlite_timeout_sec: 120.0

source_registry:
  path: "data/free_source_registry.yaml"

# Family-aware readers must resolve paths from this mapping and fail when a
# family/key is absent. The legacy industrials_universe block remains below for
# defense compatibility while existing shared stages are migrated.
model_families:
  defense:
    model_family: defense
    universe:
      seed_csv: "defense/system_csvs/defense_tickers.csv"
      seed_source_id: defense_ticker_seed
      policy_path: "defense/data/defense_universe_policy.yaml"
      cohort_path: "defense/data/defense_cohorts.yaml"
      cohort_source_id: defense_cohort_policy
      historical_membership_csv: "defense/system_csvs/defense_historical_membership.csv"
      historical_membership_source_id: defense_historical_membership_seed
      delisted_seed_csv: "defense/system_csvs/aerospace_defense_delisted.csv"
      delisted_source_id: defense_delisted_calibration_seed
      ticker_aliases_csv: "defense/system_csvs/defense_ticker_aliases.csv"
      ticker_aliases_source_id: defense_ticker_alias_seed
      listing_dates_csv: "defense/system_csvs/defense_listing_dates.csv"
  machinery:
    model_family: machinery
    universe:
      seed_csv: "machinery/system_csvs/machinery_tickers.csv"
      seed_source_id: machinery_ticker_seed
      policy_path: "machinery/data/machinery_universe_policy.yaml"
      cohort_path: "machinery/data/machinery_cohorts.yaml"
      cohort_source_id: machinery_cohort_policy
      historical_membership_csv: "machinery/system_csvs/machinery_historical_membership.csv"
      historical_membership_source_id: machinery_historical_membership_seed
      delisted_seed_csv: "machinery/system_csvs/machinery_delisted.csv"
      delisted_source_id: machinery_delisted_calibration_seed
      ticker_aliases_csv: "machinery/system_csvs/machinery_ticker_aliases.csv"
      ticker_aliases_source_id: machinery_ticker_alias_seed
      listing_dates_csv: "machinery/system_csvs/machinery_listing_dates.csv"
  transportation:
    model_family: transportation
    universe:
      seed_csv: "transportation/system_csvs/transportation_tickers.csv"
      seed_source_id: transportation_ticker_seed
      policy_path: "transportation/data/transportation_universe_policy.yaml"
      cohort_path: "transportation/data/transportation_cohorts.yaml"
      cohort_source_id: transportation_cohort_policy
      historical_membership_csv: "transportation/system_csvs/transportation_historical_membership.csv"
      historical_membership_source_id: transportation_historical_membership_seed
      delisted_seed_csv: "transportation/system_csvs/transportation_delisted.csv"
      delisted_source_id: transportation_delisted_calibration_seed
      ticker_aliases_csv: "transportation/system_csvs/transportation_ticker_aliases.csv"
      ticker_aliases_source_id: transportation_ticker_alias_seed
      listing_dates_csv: "transportation/system_csvs/transportation_listing_dates.csv"
      cik_ticker_overrides_csv: "transportation/system_csvs/transportation_cik_ticker_overrides.csv"
      norgate_symbol_map_csv: "transportation/system_csvs/transportation_norgate_symbol_map.csv"
      norgate_symbol_overrides_csv: "transportation/system_csvs/transportation_norgate_symbol_overrides.csv"
      security_continuity_overrides_csv: "transportation/system_csvs/transportation_security_continuity_overrides.csv"
      security_continuity_source_id: transportation_security_continuity_policy
      classification_overlays_csv: "transportation/system_csvs/transportation_classification_overlays.csv"
      classification_policy_version: transportation_classification_v1
      investable_universe_policy: "transportation/data/transportation_investable_universe_v4.yaml"
      investable_universe_version: transportation_investable_universe_v4
      optimization_start_date: "2019-01-02"
      delisted_default_start_date: "2000-01-01"
      sector: Industrials
      industry: Transportation
      subsector: Transportation
      benchmark_ticker: IYT
      benchmark_tickers: [IYT, XTN, SPY]
    market:
      primary_benchmark: IYT
      benchmark_tickers: [IYT, XTN, SPY]
      stage3_output_dir: "../output/industrials/transportation/stage3"
      delisted_export_dir: "../output/industrials_reports/market_data"
    norgate_delisted_import:
      source_id: norgate_us_equities_total_return
      output_csv: "../output/industrials/transportation/stage3/norgate_delisted_price_import.csv"
      price_adjustment_mode: CAPITAL
      purge_existing_range: true
    historical_load:
      start_date: "2019-01-02"
      active_price_source_id: yahoo_finance_adjusted
      delisted_price_source_id: norgate_us_equities_total_return
      benchmark_tickers: [IYT, XTN, SPY]
      required_fx_pairs: [BRLUSD, CADUSD, CLPUSD, CNYUSD, COPUSD, EURUSD, GBPUSD, MXNUSD, NOKUSD]
      approved_price_exclusions: [RRTS]
      output_dir: "../output/industrials/transportation/historical_load"
    financial:
      metric_registry: "transportation/data/transportation_metric_registry.yaml"
      concept_aliases_csv: "transportation/system_csvs/transportation_xbrl_concept_aliases.csv"
      ticker_scoped_concept_aliases_csv: "transportation/system_csvs/transportation_ticker_xbrl_concept_aliases.csv"
      supplemental_disclosure_source_ids:
        - "dedicated_parser_transportation_required_metric_repair_v1"
        - "transportation_reviewed_required_metric_operand_v1"
        - "transportation_surface_reentry_operand_v1"
        - "transportation_tanker_capex_operand_v1"
        - "transportation_asc_operating_bridge_v1"
      sec_sync_output_csv: "../output/industrials/transportation/stage4/sec_fundamentals_sync.csv"
      feature_output_csv: "../output/industrials/transportation/stage4/financial_feature_coverage.csv"
      metric_availability_output_csv: "../output/industrials/transportation/stage4/transportation_metric_availability.csv"
      metric_validation_output_json: "../output/industrials/transportation/stage4/transportation_metric_validation.json"
      share_conversion_overrides_csv: "transportation/system_csvs/transportation_share_conversion_overrides.csv"
      canonical_concept_overrides_csv: "transportation/system_csvs/transportation_canonical_fact_concept_overrides.csv"
      valuation_source_audit_output_csv: "../output/industrials/transportation/valuation/transportation_pit_valuation_source_audit.csv"
      valuation_source_audit_output_json: "../output/industrials/transportation/valuation/transportation_pit_valuation_source_audit.json"
      share_source_evidence_output_csv: "../output/industrials/transportation/valuation/transportation_share_source_evidence.csv"
      share_source_evidence_summary_csv: "../output/industrials/transportation/valuation/transportation_share_source_evidence_summary.csv"
      share_source_evidence_output_json: "../output/industrials/transportation/valuation/transportation_share_source_evidence.json"
    share_snapshot_ingestion:
      # Shared loader, transportation-scoped facts.  Outstanding shares drive
      # valuation; public float drives liquidity/short-interest.  They must not
      # be substituted for one another without the explicit proxy flag.
      history_start: "2019-01-02"
      output_csv: "../output/industrials/transportation/stage3/transportation_share_snapshot_coverage.csv"
      share_conversion_overrides_csv: "transportation/system_csvs/transportation_share_conversion_overrides.csv"
      reviewed_share_observations_csv: "transportation/system_csvs/transportation_reviewed_share_observations.csv"
      # IB remains first in source precedence, but error 10358 confirmed this
      # account lacks the fundamentals entitlement. Re-enable after entitlement
      # is provisioned; never substitute generic-tick shortableShares as float.
      enable_ib_fundamentals: false
      enable_yahoo_statistics: true
      ib_host: "127.0.0.1"
      ib_port: 7497
      ib_client_id: 7831
      ib_market_data_type: 1
      ib_generic_tick_list: "258"
      ib_snapshot_wait_sec: 4.0
      ib_batch_size: 25
      yahoo_workers: 4
      request_spacing_sec: 0.10
      # Keep the loader operational while foreign/legacy filings remain under
      # reviewed conversion policy.  Promotion gates can be stricter, but must
      # not lower this threshold silently.
      minimum_outstanding_coverage: 0.90
    specialized_disclosures:
      # Item-6 coverage pass: one latest annual and one latest interim filing
      # per issuer. This bounded sample measures parser coverage before any
      # full historical disclosure backfill is authorized.
      include_historical: true
      annual_filings_per_ticker: 1
      interim_filings_per_ticker: 1
      # Historical feature production begins on 2019-01-02. Load the preceding
      # 400-day disclosure window so the first PIT snapshot can use only facts
      # that were actually available by that date.
      historical_backfill_start_date: "2017-11-28"
      historical_max_filings_per_ticker: 0
      max_candidate_staleness_days: 400
      download_workers: 4
      parallel_request_spacing_sec: 0.5
      minimum_active_document_coverage: 0.95
      minimum_all_document_coverage: 0.90
      minimum_accepted_ticker_coverage_for_historical_scale: 0.25
      sync_output_csv: "../output/industrials/transportation/stage4/transportation_specialized_disclosure_sync.csv"
      sync_output_json: "../output/industrials/transportation/stage4/transportation_specialized_disclosure_sync.json"
      review_output_csv: "../output/industrials/transportation/stage4/transportation_specialized_disclosure_review.csv"
      validation_output_json: "../output/industrials/transportation/stage4/transportation_specialized_disclosure_validation.json"
      historical_sync_output_csv: "../output/industrials/transportation/historical_load/transportation_historical_specialized_disclosure_sync.csv"
      historical_sync_output_json: "../output/industrials/transportation/historical_load/transportation_historical_specialized_disclosure_sync.json"
      historical_validation_output_json: "../output/industrials/transportation/historical_load/transportation_historical_specialized_disclosure_validation.json"
    dedicated_parser:
      discovery_registry_version: transportation_metrics_v3_discovery
      discovery_registry_csv: "transportation/data/transportation_specialized_metric_discovery_registry.csv"
      supporting_registry_version: transportation_parser_support_v1
      supporting_registry_csv: "transportation/data/transportation_parser_supporting_metric_registry.csv"
      archetype_policy_yaml: "transportation/data/transportation_operating_archetype_policy.yaml"
      archetype_map_csv: "transportation/data/transportation_operating_archetypes.csv"
      scope_version: transportation_dedicated_parser_scope_v1
      scope_manifest_csv: "transportation/data/transportation_dedicated_parser_scope.csv"
      supporting_scope_version: transportation_dedicated_parser_support_scope_v1
      supporting_scope_manifest_csv: "transportation/data/transportation_dedicated_parser_support_scope.csv"
      dp0_manifest_json: "transportation/data/transportation_dp0_contract_manifest.json"
      dp0_active_seed_csv: "transportation/system_csvs/dp0_v1/transportation_tickers.csv"
      dp1_readiness_audit_json: "transportation/data/transportation_dp1_readiness_audit.json"
      source_census_version: transportation_dp3_source_census_v2
      # Active issuers need the 400-day PIT lead-in to the 2019 research
      # window. Inactive issuers are searched over their cached SEC lifetime
      # so legacy/delisted calibration names are not silently omitted.
      source_census_start_date: "2017-11-28"
      source_census_legacy_inactive_start_date: "2000-01-01"
      source_census_asof_date: "2026-07-22"
      source_census_expected_identity_count: 160
      source_census_expected_base_accessions: 4267
      source_census_csv: "transportation/data/transportation_dedicated_parser_source_census.csv"
      source_decisions_csv: "transportation/data/transportation_dedicated_parser_source_decisions.csv"
      source_cache_gaps_csv: "transportation/data/transportation_dedicated_parser_cache_gaps.csv"
      source_census_manifest_json: "transportation/data/transportation_dp3_source_census_manifest.json"
      source_gap_overrides_csv: "transportation/review_policies/transportation_source_gap_overrides.csv"
      output_root: "../output/industrials/transportation/dedicated_parser"
      tanker_delta_output_root: "../output/industrials/transportation/investable_v3/tanker_delta"
      provider_state_dir: "../tmp/edgartools/transportation"
      workers: 4
      hydration_passes: 3
      max_filings_per_ticker: 0
      max_documents_per_filing: 0
      # The DP6S corpus is parsed once. Do not truncate large annual reports
      # and do not defer image-only PDFs to a second historical pass.
      pdf_ocr_enabled: true
      max_pdf_pages: 0
      max_pdf_bytes: 75000000
      pdf_extraction_timeout_seconds: 120.0
      production_enabled: false
      parser_execution_authorized: false
      # DP6A coverage-lift targeting: include metrics that need no more than
      # two additional usable active issuers to meet the broad or exact-
      # archetype breadth gate. This stage is local/read-only and cannot
      # authorize hydration or parsing.
      coverage_lift_near_gate_max_issuer_shortfall: 2
      # DP6E audits SEC submissions history directly instead of treating the
      # already-loaded fact_sec_filing registry as the complete event-form
      # universe. The audit is metadata-only and cannot authorize hydration,
      # parsing, historical materialization, calibration, or promotion.
      source_exhaustion_version: transportation_dp6e_source_exhaustion_v2
      baseline_artifacts:
        - "transportation/data/transportation_metric_registry.yaml"
        - "../output/industrials/transportation/stage4/transportation_metric_availability.csv"
        - "../output/industrials/transportation/historical_features/transportation_pit_feature_history_build.json"
        - "../output/industrials/transportation/historical_features/transportation_pit_feature_history_validation.json"
        - "../output/industrials/transportation/dashboard/2026-07-22/transportation_final_rank_table.csv"
        - "../output/industrials/transportation/dashboard/2026-07-22/transportation_final_rank_table_manifest.json"
        - "../output/industrials/transportation/dashboard/2026-07-22/transportation_portfolio_adapter_validation.json"
    historical_features:
      # Month-end is an observation/coverage cadence for building the research
      # feature panel. It is not a portfolio rebalance policy.
      start_date: "2019-01-02"
      observation_cadence: month_end
      benchmark_ticker: IYT
      output_root: "../output/industrials/transportation/historical_features"
      build_report_csv: "../output/industrials/transportation/historical_features/transportation_pit_feature_history_build.csv"
      build_manifest_json: "../output/industrials/transportation/historical_features/transportation_pit_feature_history_build.json"
      validation_output_json: "../output/industrials/transportation/historical_features/transportation_pit_feature_history_validation.json"
    historical_scores:
      # Daily rank snapshots follow the benchmark trading calendar. Financial
      # and specialized values reuse the latest sealed month-end PIT snapshot
      # at or before each date; this avoids repeated parsing and remains
      # outcome-blind. Market and positioning features are exact-date builds.
      start_date: "2019-01-02"
      benchmark_ticker: IYT
      benchmark_source_id: yahoo_finance_adjusted
      # Freeze the policy used for retrospective score recomputation. Feature,
      # filing, market, and membership dates remain their original PIT asofs.
      policy_lock_date: "2026-07-30"
      # The v2 research reconstruction is versioned and must never overwrite
      # the immutable v1/release dashboard snapshots.
      output_root: "../output/industrials/transportation/surface_freight_v2/dashboard"
      feature_output_root: "../output/industrials/transportation/surface_freight_v2/scoring_features"
      build_report_csv: "../output/industrials/transportation/surface_freight_v2/score_history/transportation_weekly_score_history_build.csv"
      build_manifest_json: "../output/industrials/transportation/surface_freight_v2/score_history/transportation_weekly_score_history_build.json"
    scoring:
      feature_output_csv: "../output/industrials/transportation/stage6/transportation_scoring_features.csv"
      validation_output_json: "../output/industrials/transportation/stage6/transportation_scoring_validation.json"
      dashboard_root: "../output/industrials/transportation/dashboard"
      output_column_map: "transportation/data/transportation_output_column_map.yaml"
      # The bounded walk-forward calibration retained every specialized overlay
      # at zero. Current scoring must therefore reproduce the generic-only
      # baseline exactly; specialized evidence remains visible for research and
      # coverage reporting but cannot affect scores or rank readiness.
      score_construction_mode: surface_freight_fixed_denominator_v2
      surface_freight_score_policy: "transportation/data/transportation_surface_freight_score_policy_v2.yaml"
      prebuild_contract_output_dir: "../output/industrials/transportation/prebuild/surface_freight_score_v2"
      prebuild_contract_manifest: "../output/industrials/transportation/prebuild/surface_freight_score_v2/transportation_surface_freight_prebuild_manifest.json"
      specialized_overlay_weights:
        fleet_utilization: 0.00
        operating_ratio: 0.00
        load_factor_or_utilization: 0.00
      calibration_candidate_metric_map:
        passenger_load_factor: load_factor_or_utilization
      max_staleness_days: 7
      minimum_avg_dollar_volume_60d: 1000000
      minimum_score_confidence: 0.35
      # Enforced only when at least one bounded specialized overlay is active.
      minimum_specialized_coverage: 0.15
      # Shared positioning is materialized by the family-pinned transportation
      # wrapper. It remains a zero-weight research component until a clean,
      # post-freeze calibration selects a non-zero weight.
      positioning_feature_source_id: industrials_positioning_composite
      minimum_positioning_input_coverage: 0.50
      score_model_version: transportation_shadow_score_v1
      model_version: transportation_model_v1_shadow
      scoring_contract_version: transportation_final_rank_table_v1_shadow
      component_weights:
        market_trend: 0.25
        quality: 0.15
        growth: 0.10
        valuation: 0.10
        operating_efficiency: 0.15
        capital_risk: 0.20
        development_stage_risk: 0.05
        positioning: 0.00

industrials_universe:
  initial_subsector: "defense"
  # CF-4: expected_ticker_count lives ONLY in the universe policy YAML
  # (defense/data/defense_universe_policy.yaml -> expected_ticker_count). The config
  # copy was removed as a duplicated source of truth; readers (01/02/06/08_validate/04b)
  # are being unified on the policy YAML. Do not re-add a copy here.
  seed_csv: "defense/system_csvs/defense_tickers.csv"
  seed_source_id: "defense_ticker_seed"
  policy_path: "defense/data/defense_universe_policy.yaml"
  cohort_path: "defense/data/defense_cohorts.yaml"
  cohort_source_id: "defense_cohort_policy"
  historical_membership_csv: "defense/system_csvs/defense_historical_membership.csv"
  historical_membership_source_id: "defense_historical_membership_seed"
  delisted_seed_csv: "defense/system_csvs/aerospace_defense_delisted.csv"
  delisted_source_id: "defense_delisted_calibration_seed"
  ticker_aliases_csv: "defense/system_csvs/defense_ticker_aliases.csv"
  ticker_aliases_source_id: "defense_ticker_alias_seed"
  listing_dates_csv: "defense/system_csvs/defense_listing_dates.csv"
  cik_ticker_overrides_csv: "defense/system_csvs/defense_cik_ticker_overrides.csv"
  # CF-6: removed dead key cik_ticker_overrides_source_id (no reader). The override
  # CSV above is applied directly by the defense loaders/validators; no source-registry
  # id is recorded for it.
  optimization_start_date: "2010-01-01"
  delisted_default_start_date: "2000-01-01"
  sector: "Industrials"
  industry: "Aerospace & Defense"
  subsector: "Defense"
  country: "United States"
  currency: "USD"
  benchmark_ticker: "XAR"
  # CF-6: removed dead key robustness_benchmark_ticker (no reader). Actual controls:
  # benchmark_tickers below (price sync), market_feature_build.secondary_benchmarks
  # (feature columns), and oos_calibration_standards.families.defense.robustness_benchmark_ticker.
  benchmark_tickers:
    - XAR
    - ITA
    - SPY

market_data_policy:
  scoring_primary_source: "yahoo_finance_adjusted"
  # CF-10: pinned here as the authoritative fallback chain; most scripts carry an
  # in-code default of [] for this key (04b differs) — never rely on the in-code default.
  scoring_fallback_sources:
    - "norgate_us_equities_total_return"
  # CF-6/MK-6: consumed by script 04's market-data policy audit, which escalates
  # missing adjusted close to a failed severity when true (wired in the 2026-07
  # audit remediation batch).
  require_adjusted_for_scoring: true
  max_staleness_days: 7
  # CF-5: single source of truth for full-feature thresholds. The duplicate copies
  # previously under market_feature_build were removed; builder (05) and the
  # auditor/validator (04/06) must all read the two keys below.
  min_trading_days_for_full_features: 252
  min_avg_dollar_volume_60d_for_full_features: 5000000

yahoo_price_ingestion:
  source_id: "yahoo_finance_adjusted"
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  start_date: "2010-01-01"
  interval: "1d"
  events: "div,splits"
  include_adjusted_close: true
  # CF-6: removed dead key include_benchmark_tickers (no reader). Benchmarks are
  # always synced from industrials_universe.benchmark_tickers unless --skip-benchmarks
  # is passed to script 03.
  user_agent: "${INDUSTRIALS_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  timeout_sec: 30.0
  max_retries: 3
  parallel_workers: 4
  cache_dir: "../output/industrials_cache/yahoo_adjusted"
  # DR-5: defense-instance path. Script in-code default output paths template
  # {model_family}; a non-defense family run must not reuse this literal defense path.
  output_csv: "../output/industrials/defense/stage3/yahoo_adjusted_price_coverage.csv"
  ticker_start_date_overrides: {}
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

market_data_audit:
  output_csv: "../output/industrials/defense/stage3/market_data_source_audit.csv"

market_feature_build:
  source_id: "yahoo_finance_adjusted"
  output_csv: "../output/industrials/defense/stage3/market_feature_coverage.csv"
  # CF-5: min_trading_days_for_full_features / min_avg_dollar_volume_60d_for_full_features
  # were removed from this block — market_data_policy above is the single source.
  # DR-3: config-driven secondary benchmark columns (replaces the XAR/ITA literals
  # hardcoded in script 05). Order defines the secondary rel_strength column slots;
  # this list preserves current defense behavior.
  secondary_benchmarks:
    - XAR
    - ITA
  windows:
    one_month_days: 21
    three_month_days: 63
    six_month_days: 126
    one_year_days: 252
    skip_latest_month_days: 21
    volatility_days: 60
    ma_short_days: 50
    ma_long_days: 200

rank_export:
  defense_capacity_overrides_csv: "defense/system_csvs/defense_capacity_overrides.csv"

norgate_delisted_import:
  source_id: "norgate_us_equities_total_return"
  symbol_overrides_csv: "defense/system_csvs/defense_norgate_symbol_overrides.csv"
  output_csv: "../output/industrials/defense/stage3/norgate_delisted_price_import.csv"
  price_adjustment_mode: "CAPITAL"
  purge_existing_range: true

sec_fundamentals:
  submissions_source_id: "sec_submissions"
  companyfacts_source_id: "sec_companyfacts"
  submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
  companyfacts_url_template: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  reporting_overrides_csv: "defense/system_csvs/defense_sec_reporting_overrides.csv"
  # CF-10: authoritative; the in-code default is 2015-01-01 — never rely on it.
  start_date: "2000-01-01"
  # CF-10 semantics: this explicit list is authoritative and must stay non-empty.
  # An empty list is ambiguous in code (one branch treats it as "all forms", another
  # as {10-K, 10-Q}); do not express "all forms" by emptying this list.
  forms:
    - "10-K"
    - "10-K/A"
    - "10-Q"
    - "10-Q/A"
    - "10-12B"
    - "10-12B/A"
    - "20-F"
    - "20-F/A"
    - "40-F"
    - "40-F/A"
    - "6-K"
    - "S-1"
    - "S-1/A"
    - "S-4"
    - "S-4/A"
    - "F-1"
    - "F-1/A"
    - "F-10"
    - "F-10/A"
    - "424B3"
    - "424B4"
    - "8-K"
    - "8-K/A"
  include_historical_members: false
  # CF-6: removed dead key neutral_fallback_enabled (no reader). Fallback/neutral
  # profiles are auto-authored unconditionally by 08_build; the gate on them is
  # 08_validate's --strict-fallbacks / the FN-6 zero-usable-profiles error.
  user_agent: "${INDUSTRIALS_SEC_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  timeout_sec: 30.0
  max_retries: 3
  request_sleep_sec: 0.12
  cache_dir: "../output/industrials_cache/sec_fundamentals"
  # FN-8: retention window (days) for raw network responses recorded by script 07;
  # older rows are pruned each run, 0 disables pruning. Pinned to the in-code default (90).
  raw_response_retention_days: 90
  sync_output_csv: "../output/industrials/defense/stage4/sec_fundamentals_coverage.csv"
  feature_output_csv: "../output/industrials/defense/stage4/financial_feature_coverage.csv"
  metric_availability_output_csv: "../output/industrials/defense/stage4/financial_metric_availability.csv"
  supplemental_disclosure_source_ids:
    - "dedicated_parser_defense_production"

dedicated_parser:
  output_root: "../output/industrials/defense/dedicated_parser"
  provider_state_dir: "../tmp/edgartools/defense"
  python_executable: "${DEDICATED_PARSER_PYTHON:-C:/Users/josel/miniconda3/envs/scalper-staging/python.exe}"
  # Event filings from this date support the first 2019 PIT score snapshots
  # while avoiding an unbounded pre-research 8-K document archive.
  event_filing_start_date: "2018-01-01"
  # Full-universe adjudication completed 2026-07-26 (649 reviewed policies,
  # run 56: 0 failures, both golden corpora PASS, deterministic content
  # fingerprints, production rank-table hash unchanged). Promotion populates
  # dedicated_parser_defense_production only; scoring weight for the demand
  # pillar still requires the candidate PIT/OOS run to beat baseline (script 29).
  production_enabled: true
  production_source_id: "dedicated_parser_defense_production"
  production_min_confidence: 0.90
  production_manifest_json: "../output/industrials/defense/dedicated_parser/dedicated_parser_production_promotion.json"
  workers: 4
  max_filings_per_ticker: 40
  max_documents_per_filing: 32
  pdf_ocr_enabled: true
  max_pdf_pages: 250
  max_pdf_bytes: 25000000
  pdf_extraction_timeout_seconds: 30.0

financial_validation:
  availability_policy:
    # Defense issuers may carry funded/appropriated government backlog. A
    # missing value stays NOT_DISCLOSED until reviewed policy marks it N/A.
    funded_backlog_default_applicable: true
    funded_backlog_applicable_tickers: []
    cancelable_order_model_tickers: []
    structural_no_backlog_tickers: []
    structural_no_inventory_tickers: []
    recent_public_share_basis_transition_tickers: []

fx_rates:
  source_id: "yahoo_fx_rates"
  # CF-6: removed dead key default_usd_rate (no reader). USD is handled as an
  # identity 1.0 rate in the 08_build conversion path; missing non-USD rates fail closed.
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{pair}"
  start_date: "2010-01-01"
  interval: "1d"
  user_agent: "${INDUSTRIALS_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  timeout_sec: 30.0
  max_retries: 3
  request_sleep_sec: 0.12
  cache_dir: "../output/industrials_cache/yahoo_fx_rates"
  output_csv: "../output/industrials/defense/stage4/fx_rate_coverage.csv"
  # MK-3: maximum age (days before the evaluation asof) of an FX rate usable for
  # conversion; older rates must be rejected by the 08_build lookup / 11's gating.
  max_staleness_days: 30
  required_pairs:
    - CADUSD
    - GBPUSD
    - EURUSD
    - ILSUSD

positioning_import:
  source_id: "industrials_positioning_composite"
  form4_source_id: "sec_insider_upstream"
  direct_ownership_source_id: "sec_ownership_direct"
  market_positioning_source_id: "market_positioning_upstream"
  # SC-17: ranked source preference (most-preferred first) for the positioning feature
  # readers over fact_13f_positioning / fact_short_interest / fact_ibkr_borrow_snapshot
  # in scripts/09. Pins the single live writer id (market_positioning_source_id above);
  # extend this list BEFORE registering any second positioning source so the feature
  # readers stay scoped instead of silently mixing sources.
  preferred_source_ids:
    - market_positioning_upstream
  positioning_overrides_csv: "defense/system_csvs/defense_positioning_overrides.csv"
  # CF-10: authoritative; the in-code default is 2016-01-01 — never rely on it.
  start_date: "2000-01-01"
  include_historical_members: true
  positioning_universe_csv: "../output/industrials_cache/positioning/defense_positioning_universe.csv"
  output_csv: "../output/industrials/defense/stage5/positioning_import_coverage.csv"
  feature_output_csv: "../output/industrials/defense/stage5/positioning_feature_coverage.csv"
  lookback_days:
    insider: 90
    short_change: 92
  # PS-6: staleness bounds for point-in-time positioning lookups (days before the
  # evaluation asof). Rows older than these must not satisfy the gates or be used
  # in features marked 'complete'.
  # A13-7 (2026-08-05): script 09 applies max_13f_staleness_days as a
  # publication-calendar-capped clock (industrials/core/sec_13f_calendar.py): a
  # ticker's 13F only counts as stale once BOTH the snapshot age exceeds this
  # bound AND the SEC DERA archive that must carry the next filing round has
  # been publishable in the worst observed case (window end + ~17d lag + 3d
  # grace). The gate never demands a filing the source cannot yet publish —
  # e.g. last-filing 2026-05-08 + 120d would have armed 2026-09-06 while the
  # jun-aug archive can land ~2026-09-17; the capped clock arms 2026-09-20.
  max_13f_staleness_days: 120
  max_borrow_staleness_days: 10
  require_upstream_13f_for_gate: true
  require_upstream_short_for_gate: true
  # Percent-of-float requires a float-shares source. The free FINRA feed carries
  # none, so this stays false until a float source is wired; raw short-interest
  # presence is still enforced by require_upstream_short_for_gate above.
  require_short_pct_float_for_gate: false
  require_upstream_borrow_for_gate: true
  upstream_form4_gate_exempt_tickers: []
  upstream_13f_gate_exempt_tickers: []
  upstream_short_gate_exempt_tickers: []
  upstream_short_pct_float_gate_exempt_tickers: []
  upstream_borrow_gate_exempt_tickers: []
  institutional_13f_data_gate:
    required_period_of_report: "2026-06-30"
    anchor_tickers:
      - LMT
      - RTX
      - NOC
      - GD
      - LHX
      - HEI
    min_anchor_tickers_with_period: 4

positioning_validation:
  # PS-5: minimum fraction of the gated universe that must have Form 4 coverage for
  # validator 14 to pass. Current defense coverage is 100%; retain operational
  # headroom while failing closed if the insider feed is missing or misrouted.
  min_form4_covered_fraction: 0.90

# NEW-5: removed dead key market_positioning.finra_api_publication_lag_days (no reader) — the FINRA dissemination-lag default lives in market_positioning/api_collectors.py.

upstream_databases:
  # SC-18: env-var fallback pattern is "${ENV_VAR:-machine_default}"; the defaults are
  # machine-specific — set the env vars on other hosts. Readers must fail loudly if a
  # db_path key is absent (never Path("None")).
  # CF-6: removed dead access_mode keys (no reader enforced them). Read-only access is
  # a per-connection concern in code; note script 13 read-writes market_positioning
  # by design.
  form4:
    db_path: "${SEC_INSIDER_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/sec_insider.sqlite}"
  market_positioning:
    db_path: "${MARKET_POSITIONING_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/market_positioning.sqlite}"

scoring_policy:
  # DR-1/DR-5: family-scoped policy resolution. Shared scripts read
  # scoring_policy.families.<model_family>.* and must raise loudly when the family
  # block is absent (no silent fallback to the defense policy for other families).
  # Default output paths template {model_family} in the scripts' in-code defaults.
  families:
    defense:
      eligibility_policy_csv: "defense/system_csvs/defense_scoring_eligibility_policy.csv"
      # DR-2: family-scoped reporting-overrides resolution for script 07 (legacy
      # fallback: the flat sec_fundamentals.reporting_overrides_csv; keep both in sync).
      reporting_overrides_csv: "defense/system_csvs/defense_sec_reporting_overrides.csv"
      # Append-only decisions produced by Stage 4.5. Keeping these separate from
      # source overrides makes every profile graduation dated and reviewable.
      reporting_profile_graduations_csv: "defense/system_csvs/defense_reporting_profile_graduations.csv"
      reporting_profile_graduation_audit_csv: "../output/industrials/defense/stage4/reporting_profile_graduation_audit.csv"
      profile_graduation:
        max_annual_age_days: 550
        min_periodic_filings: 2
    transportation:
      eligibility_policy_csv: "transportation/system_csvs/transportation_scoring_eligibility_policy.csv"
      eligibility_audit_csv: "../output/industrials/transportation/stage6/scoring_eligibility_policy_audit.csv"
      reporting_overrides_csv: "transportation/system_csvs/transportation_sec_reporting_overrides.csv"
      reporting_profile_graduations_csv: "transportation/system_csvs/transportation_reporting_profile_graduations.csv"
      reporting_profile_graduation_audit_csv: "../output/industrials/transportation/stage4/reporting_profile_graduation_audit.csv"
      profile_graduation:
        max_annual_age_days: 550
        min_periodic_filings: 2
  # Legacy flat key kept for backward compatibility while readers migrate to
  # scoring_policy.families.defense.eligibility_policy_csv above; keep both in sync.
  defense_eligibility_policy_csv: "defense/system_csvs/defense_scoring_eligibility_policy.csv"

sec_archive:
  enabled: true
  # The bounded parser hydration stage supplies --archive-selected. Daily SEC
  # refreshes must not rescan every historical filing for every defense name.
  all_family_members: false
  index_url_template: "https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/index.json"
  document_url_template: "https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/{document_name}"
  submission_file_url_template: "https://data.sec.gov/submissions/{file_name}"
  browse_edgar_atom_url_template: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK={cik}&type={form_type}&owner=exclude&count=100&output=atom"
  max_submission_history_files: 0
  max_filings_per_ticker: 40
  supplemental_forms:
    - "8-K"
    - "8-K/A"
  max_supplemental_filings_per_ticker: -1
  # CF-10: 0 means unlimited and is authoritative; the in-code default caps at 5 —
  # never rely on the in-code default.
  max_documents_per_filing: 32
  include_pdf_documents: true
  pdf_ocr_enabled: true
  max_pdf_pages: 250
  max_pdf_bytes: 25000000
  pdf_extraction_timeout_sec: 30.0
  # FN-2: purge guard for archive re-syncs in script 07 — a refetch that stages fewer
  # than this fraction of the previously stored facts refuses to purge the existing
  # archive. Pinned to the in-code default (0.5).
  min_refetch_fact_fraction: 0.5

