      - "Top-10 production selector uses the V2 expected-return quality guardrail for concentrated allocation risk control."
      - "Shadow Top-20 research pool uses the challenger model for broader idea discovery; it is not the concentrated allocation selector."
      - "Core structural weakness is vetoed for rank; event and configured soft weakness reduce the score under the selected guardrail policy."
      - "Rank-quality cap veto keeps business-shock and severe-deterioration caps out of investable ranked lists when the cap is at or below the configured threshold."
