  source_rules:
    price_source: "norgate_us_equities_total_return"
    sec_key: "issuer_cik"
    form4_key: "issuer_cik"
    institutional_13f_key: "cusip"
    missing_borrow_short_policy: "null_insufficient_data"
  terminal_event_policy:
    wipeout: "hard_zero_on_terminal_date"
    cash_deal: "cash_consideration_on_close_date"
    cvr_or_nonzero: "explicit_recovery_value_required"
    drop_otc_tape_when_flagged: true

market_positioning:
  enabled: true
  database_path: "${BIOTECH_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/market_positioning.sqlite"
  history_start_date: "2019-01-01"
  fail_on_error: true
  user_agent: "JL, Independent Research, jm.357@hotmail.com"
  timeout_sec: 120.0
  short_interest:
    enabled: true
    source: "finra_equity_short_interest_files"
    files_base_url: "https://cdn.finra.org/equity/otcmarket/biweekly"
    cache_dir: "../output/market_positioning_cache/finra_short_interest"
    # Conservative point-in-time availability lag from FINRA settlement date to
    # public publication date. The official schedule varies around 9-12 calendar
    # days; use 12 by default to avoid look-ahead.
    publication_lag_days: 12
    sleep_sec: 0.05
    max_files_per_run: 0
  float_shares:
    # Optional point-in-time float/share snapshots used to compute
    # short_interest_pct_float = short_interest_shares / float_shares. FINRA
    # short-interest files do not include float shares. This CSV currently
    # carries dated manual shares-outstanding proxies for foreign/20-F issuers
    # whose company-facts share counts are unavailable.
    enabled: true
    required: false
    csv_path: "data/manual_float_share_proxies.csv"
    source: "manual_shares_outstanding_proxy"
    sec_public_float_proxy:
      # Internal fallback using SEC 10-K public-float disclosure converted to
      # estimated float shares with the closest prior point-in-time close. This
      # is source-tagged as a proxy and should be validated separately from any
      # direct float-share feed.
      enabled: true
      required: false
      max_filings_per_ticker: 9
    company_fact_shares_proxy:
      # Quarterly SEC company-facts shares outstanding is not true free float,
      # but it is a point-in-time denominator that prevents FINRA short interest
      # from being permanently capped when annual public-float text is stale.
      enabled: true
  institutional_13f:
    enabled: true
    source: "sec_form_13f_data_sets"
    data_sets_url: "https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets"
    cache_dir: "../output/market_positioning_cache/sec_13f"
    cusip_ticker_map_csv: "data/delisted_13f_cusip_ticker_map.csv"
    force_reprocess_archives: false
    sleep_sec: 0.2
    max_archives_per_run: 0
  ibkr_borrow:
    enabled: true
    host: "127.0.0.1"
    port: 7497
    client_id: 7822
    market_data_type: 1
    # IBKR FEE_RATE historical bars tested in this account arrive as decimal
    # annualized rates: 0.003 means 0.3%.
    fee_rate_unit: "decimal"
    fee_rate_initial_duration: "2 Y"
    fee_rate_backfill_duration: "7 Y"
    fee_rate_incremental_duration: "45 D"
    snapshot_wait_sec: 4.0
    shortable_snapshot: true
    shortable_coverage_warn_min: 50.0
    max_fee_staleness_days: 10
    max_snapshot_staleness_days: 7
    hard_to_borrow_shares: 50000.0
    batch_size: 50
    sleep_sec: 0.2
    max_tickers_per_run: 0
    backfill_max_tickers_per_run: 50
  exports:
    biotech_output_dir: "../output/biotech_index_reports"

