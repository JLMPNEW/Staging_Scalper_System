calibration:
  exclude_tickers: []
  phase1:
    output_dir: "../output/biotech_index_reports/calibration_phase1"
    exclude_current_removals: false
    train_fraction: 0.70
    embargo_days: 120
    bootstrap_iterations: 200
    horizons:
      - 60
      - 120
    next_bar_entry: true
    conflict_high_pct: 80.0
    conflict_low_pct: 20.0
    costs:
      long_round_trip_bps: 40
  tier1:
    output_dir: "../output/biotech_index_reports/calibration_tier1_120d_confirm"
    exclude_current_removals: false
    strict_feature_lag: true
    train_fraction: 0.70
    # Calendar-day embargo. 120 trading bars are roughly 174 calendar days; use
    # 185 calendar days to prevent train/test forward-return overlap.
    embargo_days: 185
    auto_expand_embargo_to_horizon_calendar_days: true
    catalyst_calendar_flag_min: 40.0
    short_interest_pct_float_flag_min: 0.10
    short_interest_signal_flag_min: 60.0
    commercial_entry_quality_neutral_score: 50.0
    borrow_overlay_thresholds:
      catalyst_score_min: 40.0
      timing_score_min: 50.0
      quality_score_min: 60.0
      momentum_score_min: 60.0
    next_bar_entry: true
    max_workers: 8
    candidate_grid_executor: "process"
    selection_policies:
      # ── Cohort-specific policies ───────────────────────────────────────────────
      # These replace the global guardrail approach with per-cohort tuning derived
      # from the IC monitor findings (borrow IC=0.096, institutional crowding
      # IC=-0.245 for commercial_profitable at 120d).
      #
      # commercial_profitable: value/growth fit matters; crowding hurts; borrow signal
      # already in score; penalise expensive-low-growth overextension.
      - name: "cohort_commercial_profitable_value_fit"
        description: "Commercial-profitable cohort: penalise overextension, stale guidance, and value traps; no soft-weakness blanket drag so rebound candidates surface."
        hard_veto: true
        hard_veto_reasons: "cash_runway_lt_9m|going_concern_confirmed|illiquid|no_active_trial_no_business_anchor|reverse_split_history|severe_runway_flag"
        hard_weakness_penalty: 10.0
        hard_weakness_penalty_reasons: "negative_clinical_event|repeated_dilution"
        soft_weakness_penalty: 0.0
        value_trap_penalty: 12.0
        leverage_fragility_penalty: 6.0
        guidance_staleness_penalty: 4.0
        commercial_cohort_overextension_penalty: 8.0
        commercial_cohort_entry_quality_penalty: 0.0
        commercial_cohort_expected_return_bonus: 4.0
        commercial_cohort_target_cohorts: "commercial_profitable_quality_or_mature"
      # late_clinical: catalyst and risk routing dominate; commercial quality
      # penalties are misleading for pre-revenue assets.
      - name: "cohort_late_clinical_catalyst_risk"
        description: "Late-clinical cohort: catalyst/risk routing only; suppress commercial quality drag; borrow squeeze bonus active."
        hard_veto: true
        hard_veto_reasons: "cash_runway_lt_9m|going_concern_confirmed|illiquid|no_active_trial_no_business_anchor|reverse_split_history|severe_runway_flag"
        hard_weakness_penalty: 8.0
        hard_weakness_penalty_reasons: "negative_clinical_event|repeated_dilution"
        soft_weakness_penalty: 4.0
        value_trap_penalty: 0.0
        leverage_fragility_penalty: 4.0
        guidance_staleness_penalty: 2.0
        commercial_cohort_overextension_penalty: 0.0
        commercial_cohort_entry_quality_penalty: 0.0
        borrow_squeeze_setup_bonus: 5.0
        borrow_distress_penalty: 8.0
      # commercial_turnaround: allow rebound candidates; lighter penalties so
      # recovering fundamentals can surface before institutional consensus forms.
      - name: "cohort_commercial_turnaround_rebound"
        description: "Commercial-turnaround cohort: light guardrails to allow rebound candidates; borrow and catalyst context gates distress."
        hard_veto: true
        hard_veto_reasons: "cash_runway_lt_9m|going_concern_confirmed|illiquid|no_active_trial_no_business_anchor|reverse_split_history|severe_runway_flag"
        hard_weakness_penalty: 6.0
        hard_weakness_penalty_reasons: "negative_clinical_event|repeated_dilution"
        soft_weakness_penalty: 2.0
        value_trap_penalty: 6.0
        leverage_fragility_penalty: 8.0
        guidance_staleness_penalty: 3.0
        commercial_cohort_overextension_penalty: 0.0
        commercial_cohort_expected_return_bonus: 2.0
        commercial_cohort_target_cohorts: "commercial_turnaround_or_unprofitable_growth"
        borrow_distress_penalty: 10.0
    risk_decomposition:
      use_for_penalty: false
      risk_penalty_mode: "legacy"
    alpha_adjustment:
      enabled: true
      benchmark_ticker: "XBI"
      # Calibration optimizes forward benchmark alpha by default so broad beta
      # moves do not look like stock-selection skill.
      return_objective: "benchmark_alpha"
    weight_optimization:
      enabled: true
      max_generated_specs: 250
      catalyst_grid:
        - 0.26
        - 0.30
        - 0.34
      credibility_grid:
        - 0.22
        - 0.26
        - 0.30
      financial_quality_grid:
        - 0.14
        - 0.18
        - 0.22
      momentum_grid:
        - 0.06
        - 0.10
      risk_penalty_grid:
        - 0.12
        - 0.16
    convex_risk_penalty_enabled: true
    risk_penalty_convexity: 0.35
    risk_penalty_inflection: 50.0
    # Smooth curve removes cliff effects at growth thresholds; promoted as production hygiene.
    growth_drag_curve: "smooth_linear"
    holdout_top_k: 25
    best_rows_limit: 25
    bootstrap_iterations: 200
    bootstrap_top_k: 10
    bootstrap_seed: 1729
    selected_ticker_diagnostic_top_ranks: 3
    medium_term_horizons:
      - 60
      - 120
    costs:
      long_round_trip_bps: 40
    recommended_stack:
      lcb_z: 1.0
      cvar_q: 0.05
      omega_hurdle: 0.0
      profit_factor_cap: 10.0
      min_selected_observations: 60
      min_asof_dates: 8
      min_net_lcb_return_pct: 0.0
      min_sortino: 0.0
      min_profit_factor: 1.15
      min_omega: 1.05
      legacy_binary_constraint_enabled: false
      aggregate_hard_constraint_enabled: false
      max_binary_weakness_exposure_pct: 10.0
      max_hard_weakness_exposure_pct: 10.0
      max_core_hard_weakness_exposure_pct: 10.0
      max_illiquid_weakness_exposure_pct: 0.0
      max_top3_gain_contribution_pct: 55.0
      max_large_loss_20_rate_pct: 30.0
      max_large_loss_40_rate_pct: 12.5
  phase2:
    output_dir: "../output/biotech_index_reports/calibration_phase2_speculative_alpha"
    exclude_current_removals: false
    train_fraction: 0.70
    next_bar_entry: true
    max_workers: 8
    bootstrap_iterations: 100
    bootstrap_top_k: 8
    holdout_top_k: 25
    bootstrap_seed: 3001
    selected_ticker_top_ranks: 5
    # Empty lists intentionally use the built-in reproducible Phase 2 signal/pool defaults.
    signal_specs: []
    pool_specs: []
    costs:
      long_round_trip_bps: 40
    recommended_stack:
      lcb_z: 1.0
      cvar_q: 0.05
      min_selected_observations: 30
      min_asof_dates: 8
      min_net_lcb_return_pct: 0.0
      min_sortino: 0.0
      min_profit_factor: 1.15
      legacy_binary_constraint_enabled: false
      aggregate_hard_constraint_enabled: false
      max_core_hard_exposure_pct: 0.0
      max_event_hard_exposure_pct: 0.0
      max_soft_exposure_pct: 35.0
      max_illiquid_exposure_pct: 0.0
      max_top3_gain_contribution_pct: 60.0
      max_large_loss_20_rate_pct: 35.0
      max_large_loss_40_rate_pct: 15.0
