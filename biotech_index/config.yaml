biotech_historical_sequence:
  # Per-child-step timeout used by 45_run_biotech_clean_historical_sequence.py.
  # Mirrors biotech_refresh.step_timeout_sec so both orchestrators share the same
  # default without requiring a CLI --step-timeout-sec override.
  step_timeout_sec: 28800

biotech_refresh:
  timing_csv: "../output/biotech_index_reports/biotech_refresh_timing.csv"
  step_timeout_sec: 28800
  max_upstream_staleness_days: 2
  validate_final_outputs: true
  ibkr_preflight:
    # Catch stale/missing IB market and borrow data before the long refresh run.
    # This mirrors the Form 4 preflight: daily production runs should not
    # silently continue when TWS/IBGateway is unavailable.
    enabled: true
    required: true
    timeout_sec: 5.0
  company_master:
    # The full screen is a slow universe-rebuild input, not a required daily
    # refresh dependency once the companies table is already seeded.
    reuse_existing_if_screen_missing: true
    min_existing_companies: 100
  form4_refresh:
    enabled: true
    required: true
    # This must be a staging-local Form 4 updater. The biotech orchestrator
    # refuses PROD paths and refuses updater configs whose sec_form4.db_path does
    # not match governance_events.form4_db_path.
    python_executable: "${PYTHON:-C:/Users/josel/miniconda3/python.exe}"
    script_path: "../SEC_FORM4_Runner/run_sec_form4_orchestrator.py"
    config_path: "../SEC_FORM4_Runner/config_sec_form4_orchestrator_staging.yaml"
    target: "form4"
    profile: "daily"
    asof_arg: "--as-of-date"
    timeout_sec: 14400
    expected_db_path: "${BIOTECH_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/sec_insider.sqlite"
    forbid_path_markers:
      - "PROD_Scalper_System"
      - "/PROD/"
      - "\\PROD\\"
  form4_preflight:
    enabled: true
    required: true
    warn_only: false
    warning_is_fatal: true
    max_staleness_days: 0
    staleness_day_basis: "business"
    # Snapshot recency alone is not enough: the snapshot can be current while
    # raw Form 4 filings are stale.  Allow a small business-day lag for SEC
    # filing/index availability, but fail if raw ingestion falls materially
    # behind the pipeline as-of date.
    raw_filing_freshness_enabled: true
    raw_filing_required: true
    max_raw_filing_lag_days: 5
    raw_filing_lag_day_basis: "business"
    raw_filing_date_sources:
      - table: "sec_ownership_submission"
        column: "filing_date"
      - table: "sec_form4_daily_ingest_log"
        column: "filing_date"
      - table: "form4_events_tier1"
        column: "filing_date"
      - table: "form4_buy_events_v1"
        column: "filing_date"
  max_snapshot_history: 30
  snapshot_outputs:
    enabled: true
    source_dir: "../output/biotech_index_reports"
    root_dir: "../output/biotech_index_reports"
    include_extensions:
      - ".csv"
      - ".json"

governance_events:
  final_scoring_universe_csv: "../output/biotech_index_reports/ctgov_final_scoring_universe.csv"
  output_csv: "../output/biotech_index_reports/governance_event_features.csv"
  form4_db_path: "${BIOTECH_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/sec_insider.sqlite"
  form4_table: "form4_events_tier1"
  form4_snapshot_table: "sec_form4_daily_state"
  form4_required: true
