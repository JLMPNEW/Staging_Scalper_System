model_family: semiconductors
source_csv: "../../../ticker_mapping/semiconductor_tickers.csv"
source_of_truth: true
expected_ticker_count: 99
allow_missing_cik_for_foreign_otc: true
default_unassigned_calibration_use: review
default_unassigned_cohort_id: semi_unassigned
default_unassigned_cohort_name: Unassigned semiconductor review
investable_security_types:
  - common stock
  - ordinary shares
  - adr/ads
  - american depositary shares
  - new york registry shares
active_listing_statuses:
  - active
non_investable_listing_statuses:
  - active_financial_status_d
  - active_financial_status_e
  - inactive_or_not_investable
  - invalid_or_inactive
benchmark_tickers:
  - SMH
  - SOXX
  - QQQ
  - SPY
required_non_cik_fields:
  - ticker
  - company_name
  - exchange
  - sector
  - industry
  - subsector
  - country
  - currency
  - security_type
  - listing_status
  - is_primary_listing
