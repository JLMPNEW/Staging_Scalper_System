    score_key: inventory_days_score
    components: [risk_control, sector_inventory_cycle]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: stage11_candidate
  - signal: wsts_cycle_exposure
    score_key: wsts_cycle_exposure_score
    components: [sector_cycle]
    source_layer: sector_overlay
    source_ids: [wsts_historical_billings, yahoo_finance_adjusted, norgate_us_equities_total_return]
    production_policy: measurement_only
    notes: "Must clear adjusted regime IC gates before entering Stage 8 candidates or production."
  - signal: inventory_days_yoy_change
    score_key: inventory_days_yoy_change_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only
    notes: "Stage 11 inventory-cycle candidate: YoY change in inventory days; rising is bad. Tested 2026-06-12 on the 182-date multi-cycle panel: no IC (mean -0.005, NW t=-0.44 @21d; t=-0.05 @63d), keep_candidate=0. Remains zero-weight; only retest if regime-conditional (down-cycle) variant is built."
  - signal: inventory_to_revenue_growth_gap
    score_key: inventory_to_revenue_growth_gap_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only
    notes: "Stage 11 inventory-cycle candidate: inventory growth minus TTM revenue growth (overbuild divergence); rising is bad. Tested 2026-06-12 on the 182-date multi-cycle panel: no IC (mean +0.001, NW t=0.11 @21d; -0.005, t=-0.36 @63d), keep_candidate=0. Remains zero-weight; only retest if regime-conditional (down-cycle) variant is built."

overlay_components:
  - component: sector_cycle
    source_layer: sector_overlay
    source_ids: [wsts_historical_billings]
    production_policy: loaded_overlay
  - component: big_tech_capex
    source_layer: sector_overlay
    source_ids: [sec_big_tech_capex]
    production_policy: loaded_overlay
  - component: equipment_cycle
    source_layer: sector_overlay
    source_ids: []
    production_policy: planned_stage11
  - component: sector_inventory_cycle
    source_layer: sector_overlay
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: planned_stage11
  - component: memory_ai_proxy
    source_layer: sector_overlay
    source_ids: []
    production_policy: planned_stage11
  - component: innovation
    source_layer: sector_overlay
    source_ids: []
    production_policy: optional_stage_later
  - component: geo_customer_risk
    source_layer: sector_overlay
    source_ids: [sec_submissions]
    production_policy: planned_stage11
