registry_version: semiconductor_signal_registry_v1
model_family: semiconductors
description: >
  Governance registry for semiconductor production, research, and planned
  scoring signals. This file is metadata only; production weights still come
  from technology/config.yaml and must be promoted manually after validation.

lockbox_policy:
  production_weight_changes_require:
    - updated diagnostics with Newey-West adjusted IC statistics
    - Stage 9 portfolio backtest review
    - explicit human promotion decision
    - config diff recorded in the lockbox ledger
  optuna_promotion: manual_only
  report_only_models:
    - stage8_best_candidate_report_only
    - stage7_static_review_candidates

signals:
  - signal: gross_margin
    score_key: gross_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: zero_weight_until_revalidated
    notes: "Margin quality signal; available from SEC canonical financial facts."
  - signal: operating_margin
    score_key: operating_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: fcf_margin
    score_key: fcf_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
