  - signal: inventory_days
    score_key: inventory_days_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: inventory_days_yoy_change
    score_key: inventory_days_yoy_change_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: stage8_candidate_only
    notes: Hardware inventory-cycle deterioration/improvement signal; Stage 8 candidate but not production-promoted.
  - signal: inventory_to_revenue_growth_gap
    score_key: inventory_to_revenue_growth_gap_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: stage8_candidate_only
    notes: Inventory growth exceeding revenue growth; Stage 8 candidate but not production-promoted.
  - signal: days_sales_outstanding
    score_key: days_sales_outstanding_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only_zero_weight
    notes: Receivables collection speed; lower is better but structural differences require IC validation.
  - signal: days_payables_outstanding
    score_key: days_payables_outstanding_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only_zero_weight
    notes: Payables funding speed; measured separately but not production-weighted without validation.
  - signal: cash_conversion_cycle
    score_key: cash_conversion_cycle_score
    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only_zero_weight
    notes: DIO plus DSO minus DPO; lower is better, but level can differ by hardware business model.
  - signal: days_sales_outstanding_yoy_change
    score_key: days_sales_outstanding_yoy_change_score
    components: [risk_control]
