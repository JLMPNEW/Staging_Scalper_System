    components: [risk_control]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: measurement_only_zero_weight
    notes: Main hardware CCC candidate; rising CCC is a working-capital deterioration warning.

planned_signals:
  - signal: backlog_growth
    source_layer: sec_filings_text
    production_policy: planned_stage11_optional
    notes: Add only if hardware backlog disclosures can be parsed consistently and clear adjusted IC gates.
