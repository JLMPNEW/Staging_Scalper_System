registry_version: technology_hardware_signal_registry_v1
model_family: technology_hardware
description: >
  Governance registry for technology-hardware production, research, and planned
  scoring signals. This file is metadata only; production weights still come
  from technology/config.yaml and must be changed manually after review.

lockbox_policy:
  production_weight_changes_require:
    - updated diagnostics with Newey-West adjusted IC statistics
    - Stage 9 portfolio backtest review
    - explicit human promotion decision
    - config diff recorded in the lockbox ledger
  optuna_promotion: manual_only
  report_only_models:
    - stage8_candidate_report_only
  current_production_model: stage7_current_production_v1
  current_challenger_model: stage8_candidate_report_only

signals:
  - signal: gross_margin
    score_key: gross_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: operating_margin
    score_key: operating_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: fcf_margin
    score_key: fcf_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: fcf_to_net_income
