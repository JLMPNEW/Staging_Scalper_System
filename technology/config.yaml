paths:
  database_path: "${TECHNOLOGY_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/technology.sqlite"
  output_dir: "../output/technology_reports"
  cache_dir: "../output/technology_cache"

runtime:
  sqlite_timeout_sec: 120.0

source_registry:
  path: "data/free_source_registry.yaml"

technology_universe:
  initial_subsector: "semiconductors"
  expected_ticker_count: 99
  seed_csv: "../ticker_mapping/semiconductor_tickers.csv"
  policy_path: "semiconductors/data/semiconductor_universe_policy.yaml"
  cohort_path: "semiconductors/data/semiconductor_cohorts.yaml"
  historical_membership_csv: "semiconductors/data/semiconductor_historical_membership.csv"
  historical_membership_source_id: "semiconductor_historical_membership_seed"
  min_historical_membership_tickers: 20
  optimization_start_date: "2010-01-01"
  scoring_lookback_years: 10
  benchmark_tickers:
    - SMH
    - SOXX
    - QQQ
    - SPY
  subsectors:
    - semiconductors
    - software_infrastructure
    - technology_hardware

technology_hardware_universe:
  expected_ticker_count: 73
  seed_csv: "../ticker_mapping/technology_hardware_cleaned.csv"
  policy_path: "technology_hardware/data/technology_hardware_universe_policy.yaml"
  cohort_path: "technology_hardware/data/technology_hardware_cohorts.yaml"
  historical_membership_csv: "technology_hardware/data/technology_hardware_historical_membership.csv"
  historical_membership_source_id: "technology_hardware_historical_membership_seed"
  min_historical_membership_tickers: 15
  optimization_start_date: "2010-01-01"
  scoring_lookback_years: 10
  benchmark_tickers:
    - QQQ
    - SPY

market_data_policy:
  scoring_primary_source: "yahoo_finance_adjusted"
  scoring_fallback_sources:
    - "ib_market_data"
  require_adjusted_for_scoring: true
  max_staleness_days: 7
  min_trading_days_for_full_features: 252
  min_avg_dollar_volume_60d_for_full_features: 5000000

yahoo_price_ingestion:
  source_id: "yahoo_finance_adjusted"
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  start_date: "2010-01-01"
  interval: "1d"
  events: "div,splits"
  include_adjusted_close: true
  include_benchmark_tickers: true
  user_agent: "${TECHNOLOGY_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.05
  timeout_sec: 30.0
  max_retries: 3
  parallel_workers: 4
  cache_dir: "../output/technology_cache/yahoo_adjusted"
  output_csv: "../output/technology_reports/market_data/yahoo_adjusted_price_coverage.csv"
  ticker_start_date_overrides:
    P: "2026-04-17"
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

market_data_audit:
  output_csv: "../output/technology_reports/market_data/market_data_source_audit.csv"

market_feature_build:
  source_id: "yahoo_finance_adjusted"
  output_csv: "../output/technology_reports/market_data/market_feature_coverage.csv"
  min_trading_days_for_full_features: 252
  windows:
    one_month_days: 21
    three_month_days: 63
    six_month_days: 126
    one_year_days: 252
    skip_latest_month_days: 21
    volatility_days: 60
    ma_short_days: 50
    ma_long_days: 200

oos_calibration_standards:
  # These dates are governance assertions used to label dated dashboard CSVs.
  # They do not independently prove PIT construction or weight immutability;
  # validators and Portfolio Layer fail closed when a score predates the
  # declared production window.
  version: "technology_oos_provenance_v1"
  families:
    semiconductors:
      calibration_provenance_version: "technology_oos_provenance_v1"
      calibration_train_start_date: "2011-01-01"
      calibration_train_end_date: "2026-06-14"
      calibration_lock_date: "2026-06-15"
      calibration_production_start_date: "2026-06-15"
      calibration_validation_method: "stage7_static_weights_with_stage8_walk_forward_challenger_review"
    software_infrastructure:
      calibration_provenance_version: "technology_oos_provenance_v1"
      calibration_train_start_date: "2011-01-01"
      calibration_train_end_date: "2026-06-14"
      calibration_lock_date: "2026-06-15"
      calibration_production_start_date: "2026-06-15"
      calibration_validation_method: "stage8_constrained_optuna_with_walk_forward_validation"
    technology_hardware:
      calibration_provenance_version: "technology_oos_provenance_v1"
      calibration_train_start_date: "2011-01-01"
      calibration_train_end_date: "2026-06-14"
      calibration_lock_date: "2026-06-15"
      calibration_production_start_date: "2026-06-15"
      calibration_validation_method: "stage7_static_weights_with_stage8_report_only_challenger"

