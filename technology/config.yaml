paths:
  database_path: "${TECHNOLOGY_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/technology.sqlite"
  output_dir: "../output/technology_reports"
  cache_dir: "../output/technology_cache"

runtime:
  sqlite_timeout_sec: 30.0

source_registry:
  path: "data/free_source_registry.yaml"

technology_universe:
  initial_subsector: "semiconductors"
  seed_csv: "../ticker_mapping/semiconductor_tickers.csv"
  policy_path: "semiconductors/data/semiconductor_universe_policy.yaml"
  cohort_path: "semiconductors/data/semiconductor_cohorts.yaml"
  optimization_start_date: "2016-01-01"
  scoring_lookback_years: 10
  benchmark_tickers:
    - SMH
    - SOXX
    - QQQ
    - SPY
  subsectors:
    - semiconductors

market_data_policy:
  scoring_primary_source: "yahoo_finance_adjusted"
  scoring_fallback_sources:
    - "ib_market_data"
  require_adjusted_for_scoring: true
  max_staleness_days: 7
  min_trading_days_for_full_features: 252
  min_avg_dollar_volume_60d_for_full_features: 5000000

yahoo_price_ingestion:
  source_id: "yahoo_finance_adjusted"
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  start_date: "2016-01-01"
  interval: "1d"
  events: "div,splits"
  include_adjusted_close: true
  include_benchmark_tickers: true
  user_agent: "${TECHNOLOGY_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.05
  timeout_sec: 30.0
  max_retries: 3
  parallel_workers: 4
  cache_dir: "../output/technology_cache/yahoo_adjusted"
  output_csv: "../output/technology_reports/market_data/yahoo_adjusted_price_coverage.csv"
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

market_data_audit:
  output_csv: "../output/technology_reports/market_data/market_data_source_audit.csv"

market_feature_build:
  source_id: "yahoo_finance_adjusted"
  output_csv: "../output/technology_reports/market_data/market_feature_coverage.csv"
  min_trading_days_for_full_features: 252
  windows:
    one_month_days: 21
    three_month_days: 63
    six_month_days: 126
    one_year_days: 252
    skip_latest_month_days: 21
    volatility_days: 60
    ma_short_days: 50
    ma_long_days: 200

sec_fundamentals:
  submissions_source_id: "sec_submissions"
  companyfacts_source_id: "sec_companyfacts"
  inline_xbrl_source_detail: "inline_xbrl_fallback"
  inline_xbrl_fallback_enabled: true
  inline_xbrl_fallback_forms:
    - "20-F"
    - "20-F/A"
    - "40-F"
  start_date: "2015-01-01"
  report_output_csv: "../output/technology_reports/sec_fundamentals/sec_fundamentals_sync_coverage.csv"
  feature_output_csv: "../output/technology_reports/sec_fundamentals/sec_financial_feature_coverage.csv"
  cache_dir: "../output/technology_cache/sec_fundamentals"
  submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
  submissions_archive_url_template: "https://data.sec.gov/submissions/{file_name}"
  companyfacts_url_template: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  include_submission_archives: true
  user_agent: "${TECHNOLOGY_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.12
  timeout_sec: 30.0
  max_retries: 3
  max_tickers_per_run: 0

fx_rates:
  source_id: "yahoo_fx_rates"
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  start_date: "2014-01-01"
  output_csv: "../output/technology_reports/sec_fundamentals/fx_rate_coverage.csv"
  cache_dir: "../output/technology_cache/yahoo_fx_rates"
  quote_currency: "USD"
  currencies: "auto"
  user_agent: "${TECHNOLOGY_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.05
  timeout_sec: 30.0
  max_retries: 3
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

positioning_import:
  source_id: "technology_positioning_composite"
  form4_source_id: "sec_insider_upstream"
  direct_ownership_source_id: "sec_ownership_direct"
  market_positioning_source_id: "market_positioning_upstream"
  start_date: "2016-01-01"
  output_csv: "../output/technology_reports/positioning/positioning_import_coverage.csv"
  feature_output_csv: "../output/technology_reports/positioning/positioning_feature_coverage.csv"
  lookback_days:
    insider: 90
    short_change: 92
  require_upstream_13f_for_gate: false
  require_upstream_short_for_gate: false
  require_upstream_borrow_for_gate: false
  require_direct_ownership_for_gate: false

sec_ownership_direct:
  source_id: "sec_ownership_direct"
  start_date: "2016-01-01"
  hfia_effective_date: "2026-03-18"
  report_output_csv: "../output/technology_reports/positioning/sec_ownership_direct_coverage.csv"
  cache_dir: "../output/technology_cache/sec_ownership"
  submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
  submissions_archive_url_template: "https://data.sec.gov/submissions/{file_name}"
  sec_archive_url_template: "https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_no_dash}/{primary_document}"
  forms:
    - "3"
    - "3/A"
    - "4"
    - "4/A"
    - "5"
    - "5/A"
  include_submission_archives: true
  user_agent: "${TECHNOLOGY_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.12
  timeout_sec: 30.0
  max_retries: 3
  max_tickers_per_run: 0

upstream_databases:
  form4:
    db_path: "${SEC_INSIDER_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/sec_insider.sqlite}"
    access_mode: "read_only"
  market_positioning:
    db_path: "${MARKET_POSITIONING_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/market_positioning.sqlite}"
    access_mode: "read_only"
