registry_version: software_infrastructure_signal_registry_v1
model_family: software_infrastructure
description: >
  Governance registry for software-infrastructure production, research, and
  planned scoring signals. This file is metadata only; production weights still
  come from technology/config.yaml and must be promoted manually after review.

lockbox_policy:
  production_weight_changes_require:
    - updated diagnostics with Newey-West adjusted IC statistics
    - Stage 9 portfolio backtest review
    - explicit human promotion decision
    - config diff recorded in the lockbox ledger
  optuna_promotion: manual_only
  report_only_models:
    - stage7_challenger_v1
    - stage8_production_v1_rollback_shadow
  current_production_model: stage8_promoted_production_v2
  current_challenger_model: stage7_challenger_v1
  current_rollback_model: stage8_production_v1_rollback_shadow
  promotion_decision_type: manual_economic_override
  promotion_effective_date: "2026-08-31"
  forward_probation_sessions: 21

signals:
  - signal: gross_margin
    score_key: gross_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: operating_margin
    score_key: operating_margin_score
    components: [quality]
    source_layer: sec_financials
    source_ids: [sec_companyfacts, sec_inline_xbrl_fallback]
    production_policy: production_allowed
  - signal: fcf_margin
    score_key: fcf_margin_score
