  - source_id: ib_market_data
    stage: stage_1
    source_name: "Interactive Brokers market data"
    source_owner: "Interactive Brokers"
    source_type: broker_api
    base_url: "127.0.0.1:7497"
    documentation_url: "https://interactivebrokers.github.io/tws-api/"
    authentication_required: true
    free_key_required: false
    rate_limit_notes: "Requires TWS or IB Gateway session plus market-data permissions. Use pacing-aware batching and cache bars."
    refresh_frequency: daily
    terms_url: "https://www.interactivebrokers.com/en/general/terms-and-conditions.php"
    data_owner: Interactive Brokers
    raw_schema:
      - raw_api_responses
    staging_tables:
