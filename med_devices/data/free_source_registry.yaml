      - fact_market_snapshot
    feature_stages:
      - technical_entry
      - valuation
      - universe
    priority: 60
    status: planned
    notes: "Live validation and fallback market-data source. Use adjusted daily bars where available; record fallback_what_to_show when raw bars are used."

  - source_id: yahoo_finance_backup
