sources:
  - source_id: sec_company_tickers
    stage: stage_1
    source_name: "SEC company tickers"
    source_owner: "U.S. Securities and Exchange Commission"
    source_type: json
    base_url: "https://www.sec.gov/files/company_tickers.json"
    documentation_url: "https://www.sec.gov/search-filings/edgar-application-programming-interfaces"
    authentication_required: false
    free_key_required: false
    rate_limit_notes: "SEC fair-access policy applies; keep below current SEC automated access limits."
    refresh_frequency: daily
    terms_url: "https://www.sec.gov/os/accessing-edgar-data"
    data_owner: SEC
    raw_schema:
      - raw_api_responses
    staging_tables:
      - stg_sec_company_tickers
    canonical_tables:
      - dim_company
      - dim_security
      - dim_identifier
    feature_stages:
      - universe
    priority: 10
    status: planned
    notes: "Primary free ticker-to-CIK source."

