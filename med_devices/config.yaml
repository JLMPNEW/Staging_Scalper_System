financial_baseline_qa:
  summary_csv: "../output/med_devices_reports/med_device_financial_baseline_qa_summary.csv"
  ranked_csv: "../output/med_devices_reports/med_device_financial_baseline_qa_ranked.csv"
  delta_csv: "../output/med_devices_reports/med_device_financial_baseline_qa_delta.csv"
