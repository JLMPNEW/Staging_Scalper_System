paths:
  database_path: "${MED_DEVICES_DB_DIR:-C:/Users/josel/Documents/STAGING/DB}/med_devices.sqlite"
  output_dir: "../output/med_devices_reports"
  cache_dir: "../output/med_devices_cache"

runtime:
  sqlite_timeout_sec: 30.0

med_devices_refresh_pipeline:
  output_dir: "../output/med_devices_reports/orchestration"
  enable_financial_baseline_qa_step: true  # post-scoring QA publisher (script 07)
  enable_share_count_qa_step: true  # post-scoring QA publisher (script 19)
  optional_external_steps:
    - 53_sync_ibkr_borrow
    - 55_sync_finra_short_volume
    - 65_update_finra_short_interest
    - 62_update_sec13f_positioning
    - 61_import_positioning
    - 63_rebuild_sec13f_common_shares
    - 68_update_form4_canonical
    - 67_audit_external_positioning
    - 73_audit_calibration_governance
  required_output_columns:
    - asof_date
    - ticker
    - portfolio_candidate_gate
    - portfolio_candidate_score
    - composite_score
    - safe_core_score
    - ic_tilted_composite_score
    - calibration_cohort
    - calibration_eligible_flag
    - classification
    - score_model_version
    - model_family
    - model_version
    - scoring_contract_version
    - sector
    - industry
    - country
    - currency
    - analyst_review_decision
    - analyst_review_reason
    - analyst_review_owner
    - analyst_reviewed_at
    - analyst_review_expires_at
    - analyst_portfolio_override_applied
    - fda_event_risk_product_family_adjusted_score
    - fda_safety_product_family_adjusted_score
    - fda_product_family_shadow_available_flag
    - fda_product_family_shadow_oos_valid_flag
    - fda_product_family_shadow_status

med_devices_production_qa:
  output_dir: "../output/med_devices_reports/production_qa"
  min_score_rows_pct_of_active: 0.95
  min_portfolio_candidates: 1
  max_feature_staleness_days: 7
  max_qa_artifact_age_days: 7  # freshness window for script 07/19 QA publisher artifacts
  fail_on_warnings: false
  review_pack_required_files:
    - med_device_daily_composite_scores.csv
    - med_device_score_review_all.csv
    - med_device_score_review_top25.csv
    - med_device_score_review_portfolio_candidates.csv
    - med_device_score_review_calibrated_baseline.csv
    - med_device_score_review_safe_core.csv
    - med_device_score_review_tier1.csv
    - med_device_score_review_pack.md

med_devices_calibration_governance:
  output_csv: "../output/med_devices_reports/calibration/med_device_calibration_governance.csv"
  output_json: "../output/med_devices_reports/calibration/med_device_calibration_governance.json"
  fail_on_stale: false
  max_days_since_historical_backfill: 30
  max_days_since_component_ic: 30
  max_days_since_component_promotion_review: 30
  max_days_since_policy_recommendations: 30
  max_days_since_optuna: 60
  max_days_since_safe_core_thresholds: 60
  max_days_since_baseline_freeze: 90

med_devices_analyst_review:
  output_dir: "../output/med_devices_reports/analyst_review"
  decisions_csv: "data/analyst_review_decisions.csv"
  decision_change_log_csv: "data/analyst_review_decision_log.csv"
  expiration_warning_days: 14
  enable_portfolio_overrides: false
  high_score_threshold: 70.0
  priority_score_threshold: 75.0
  include_portfolio_candidates: false
  allowed_decisions:
    - approve
    - reject
    - watchlist
    - data_fix_needed
    - defer

source_registry:
  path: "data/free_source_registry.yaml"

med_devices_universe:
  seed_csv: "../ticker_mapping/med_dev_tickers_clean_keep.csv"
  historical_membership_csv: "data/med_device_historical_membership.csv"
  historical_membership_source_id: "med_device_historical_membership_seed"
  min_historical_membership_tickers: 35
  market_cap_min: 250000000
  avg_dollar_volume_60d_min: 1000000
  include_us_listed_only: true
  benchmark_tickers:
    - IHI
    - XHE
  subsectors:  # documentation-only, not read by code
    - cardiovascular_devices
    - diabetes_technology
    - diagnostics_equipment
    - hospital_equipment
    - imaging
    - monitoring
    - neuro_devices
    - ophthalmology_devices
    - orthopedics
    - robotic_surgery
    - surgical_tools
    - wound_care

universe_validation:
  input_csv: "../ticker_mapping/med_dev_tickers_clean_keep.csv"
  output_csv: "../output/med_devices_reports/med_device_universe_validation.csv"
  keep_csv: "../output/med_devices_reports/med_device_tickers_keep.csv"
  clean_tickers_csv: "../output/med_devices_reports/med_dev_tickers_clean_keep.csv"
  calibration_core_csv: "../output/med_devices_reports/med_dev_tickers_calibration_core.csv"
  sec_submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
  sec_companyfacts_url_template: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  yahoo_chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  yahoo_market_range: "90d"
  yahoo_market_interval: "1d"
  yahoo_market_events: "history"
  user_agent: "${MED_DEVICES_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  cache_ttl_hours: 24.0
  http_timeout_sec: 20.0
  request_sleep_sec: 0.1
  active_listing_statuses:
    - active
  non_investable_listing_statuses:
    - active_financial_status_d
    - active_financial_status_e
    - inactive_or_not_investable
    - invalid_or_inactive
  investable_security_types:
    - common stock
    - ordinary shares
    - adr/ads
    - american depositary shares
    - new york registry shares
  us_exchanges:
    - nasdaq
    - nasd
    - nyse
    - new york stock exchange
    - nyse american
    - nyse mkt
    - amex
  recent_forms:
    - "10-K"
    - "10-Q"
    - "20-F"
    - "40-F"
  annual_forms:
    - "10-K"
    - "20-F"
    - "40-F"
  quarterly_forms:
    - "10-Q"
  core_fact_groups:
    revenue:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - Revenues
      - SalesRevenueNet
    assets:
      - Assets
    liabilities:
      - Liabilities
    cash:
      - CashAndCashEquivalentsAtCarryingValue
      - CashAndCashEquivalentsAtFairValue
    net_income:
      - NetIncomeLoss
    operating_cash_flow:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  companyfacts_currency_units:
    - USD
  min_recent_financial_filings: 4
  min_annual_filings: 2
  min_quarterly_filings: 3
  max_sec_filing_staleness_days: 550
  min_core_fact_groups: 5
  min_companyfacts_observations: 20
  max_companyfacts_staleness_days: 550
  max_market_staleness_days: 7
  min_avg_dollar_volume_60d: 1000000
  min_trading_bars: 20
  calibration_core_min_fact_years: 7.0
  calibration_core_min_core_group_years: 5.0
  calibration_short_history_min_fact_years: 3.0
  score_penalties:
    missing_cik: 30
    non_common_security_type: 25
    inactive_or_unknown_listing: 35
    non_us_primary_exchange: 20
    non_us_country: 15
    non_usd_currency: 15
    too_few_recent_financial_filings: 20
    too_few_annual_filings: 15
    too_few_quarterly_filings: 15
    no_recent_financial_filing: 35
    stale_sec_financial_filing: 30
    insufficient_core_fact_coverage: 25
    too_few_companyfacts_observations: 20
    no_companyfacts_periods: 35
    stale_companyfacts: 25
    non_usd_companyfacts_units: 20
    too_few_recent_market_bars: 20
    no_recent_market_bar: 35
    stale_market_bar: 30
    missing_latest_close: 25
    low_avg_dollar_volume_60d: 25
  default_unknown_reason_penalty: 10
  hard_exclusion_reasons:
    - missing_cik
    - non_common_security_type
    - inactive_or_unknown_listing
    - non_us_primary_exchange
    - no_recent_financial_filing
    - stale_sec_financial_filing
    - insufficient_core_fact_coverage
    - no_companyfacts_periods
    - stale_companyfacts
    - no_recent_market_bar
    - stale_market_bar
    - missing_latest_close
    - low_avg_dollar_volume_60d

market_data_policy:
  # Historical scoring and calibration should use split/dividend-adjusted prices first.
  scoring_primary_source: "yahoo_finance_backup"
  scoring_fallback_sources:
    - "ib_market_data"
  calibration_sources:
    - "yahoo_finance_backup"
    - "ib_market_data"
  live_validation_primary_source: "ib_market_data"
  require_adjusted_for_scoring: true
  max_staleness_days: 7
  audit_input_csv: "../ticker_mapping/med_dev_tickers_clean_keep.csv"
  audit_output_csv: "../output/med_devices_reports/market_data_source_audit.csv"

yahoo_price_ingestion:
  input_csv: "../ticker_mapping/med_dev_tickers_clean_keep.csv"
  output_csv: "../output/med_devices_reports/med_device_yahoo_adjusted_price_coverage.csv"
  source_id: "yahoo_finance_backup"
  chart_url_template: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
  start_date: "2000-01-01"
  interval: "1d"
  events: "div,splits"
  include_adjusted_close: true
  include_benchmark_tickers: true
  user_agent: "${MED_DEVICES_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  request_sleep_sec: 0.15
  timeout_sec: 30.0
  max_retries: 3
  parallel_workers: 4
  commit_every_tickers: 25
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

market_snapshot_ingestion:
  output_csv: "../output/med_devices_reports/med_device_market_snapshot_coverage.csv"
  primary_source_id: "ib_market_data"
  fallback_source_id: "yahoo_finance_backup"
  enable_ib_fundamentals: false
  enable_ib_fundamental_xml: false
  yahoo_quote_url_template: "https://query1.finance.yahoo.com/v7/finance/quote"
  yahoo_batch_size: 50
  yfinance_share_history_days: 370
  request_sleep_sec: 0.20
  http_timeout_sec: 30.0
  user_agent: "${MED_DEVICES_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  ib_host: "127.0.0.1"
  ib_port: 7497
  ib_client_id: 7731
  ib_default_exchange: "SMART"
  ib_default_currency: "USD"
  ib_snapshot_timeout_sec: 3.0
  ib_max_consecutive_misses: 5
  ib_generic_tick_list: "258"

sec_ingestion:
  output_csv: "../output/med_devices_reports/med_device_sec_ingestion_coverage.csv"
  submissions_source_id: "sec_submissions"
  companyfacts_source_id: "sec_companyfacts"
  sec_archives_base: "https://www.sec.gov/Archives/edgar/data"
  cache_dir: "../output/med_devices_cache/sec_ingestion"
  validation_cache_dir: "../output/med_devices_cache/universe_validation"
  submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
  companyfacts_url_template: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  submissions_file_url_template: "https://data.sec.gov/submissions/{file_name}"
  fetch_paginated_submissions: true
  user_agent: "${MED_DEVICES_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  cache_ttl_hours: 24.0
  request_sleep_sec: 0.15
  timeout_sec: 30.0
  max_retries: 3
  commit_every_companies: 25
  forms:
    - "10-K"
    - "10-K/A"
    - "10-Q"
    - "10-Q/A"
    - "20-F"
    - "20-F/A"
    - "40-F"
    - "40-F/A"
    - "8-K"
    - "8-K/A"
    - "6-K"
    - "6-K/A"
  financial_forms:
    - "10-K"
    - "10-K/A"
    - "10-Q"
    - "10-Q/A"
    - "20-F"
    - "20-F/A"
    - "40-F"
    - "40-F/A"
  preferred_units:
    default:
      - USD
      - EUR
    shares_outstanding:
      - shares
  # Companyfacts omits CERS's issuer-extension gross-profit line. Its reviewed
  # annual statement layout supports gross contribution = operating income +
  # SG&A + R&D. Interim revenue can exclude government-contract revenue, so the
  # parser deliberately limits this fallback to annual filings with direct SEC
  # inputs and a result between zero and reported annual revenue.
  annual_gross_profit_from_operating_expenses_tickers:
    - CERS

  metric_concepts:
    revenue:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - Revenues
      - SalesRevenueNet
      - SalesRevenueGoodsNet
      - SalesRevenueServicesNet
      - Revenue
      - RevenueFromContractsWithCustomers
    gross_profit:
      - GrossProfit
    operating_income:
      - OperatingIncomeLoss
      - ProfitLossFromOperatingActivities
    cost_of_revenue:
      - CostOfRevenue
      - CostOfGoodsAndServicesSold
      - CostOfGoodsSold
      - CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization
    selling_general_admin:
      - SellingGeneralAndAdministrativeExpense
      - GeneralAndAdministrativeExpense
      - SellingAndMarketingExpense
    net_income:
      - NetIncomeLoss
      - ProfitLoss
    operating_cash_flow:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
      - CashFlowsFromUsedInOperatingActivitiesContinuingOperations
      - CashFlowsFromUsedInOperations
    capital_expenditures:
      - PaymentsToAcquirePropertyPlantAndEquipment
      - PaymentsToAcquirePropertyAndEquipment
      - PaymentsToAcquireProductiveAssets
      - PaymentsToAcquireOtherProductiveAssets
      - PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities
    research_and_development:
      - ResearchAndDevelopmentExpense
      - ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost
    interest_expense:
      - InterestExpense
      - InterestAndDebtExpense
      - FinanceCosts
      - InterestExpenseOnBorrowings
    cash_and_investments:
      - CashCashEquivalentsAndShortTermInvestments
      - CashAndCashEquivalentsAtCarryingValue
      - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
      - CashAndCashEquivalentsAtFairValue
      - CashAndCashEquivalents
    total_assets:
      - Assets
    stockholders_equity:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
      - Equity
      - EquityAttributableToOwnersOfParent
    shares_outstanding:
      - EntityCommonStockSharesOutstanding
      - WeightedAverageNumberOfDilutedSharesOutstanding
      - WeightedAverageNumberOfSharesOutstandingDiluted
      - WeightedAverageNumberOfBasicSharesOutstanding
      - WeightedAverageShares
      - NumberOfSharesIssued
  cash_and_investments_concepts:
    combined:
      - CashCashEquivalentsAndShortTermInvestments
      - CashCashEquivalentsAndMarketableSecurities
    cash:
      - CashAndCashEquivalentsAtCarryingValue
      - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
      - CashAndCashEquivalentsAtFairValue
      - CashAndCashEquivalents
    securities:
      - ShortTermInvestments
      - ShortTermInvestmentsAvailableForSale
      - MarketableSecurities
      - MarketableSecuritiesCurrent
      - AvailableForSaleSecuritiesCurrent
      - DebtSecuritiesAvailableForSaleCurrent
  debt_concepts:
    direct:
      - DebtAndFinanceLeaseObligations
      - LongTermDebtAndFinanceLeaseObligations
      - LongTermDebt
      - Debt
      - Borrowings
      - FinanceLeaseLiability
      - DebtInstrumentCarryingAmount
      - NotesPayable
      - ConvertibleDebt
      - SecuredDebt
    current:
      - LongTermDebtCurrent
      - LongTermDebtAndFinanceLeaseObligationsCurrent
      - LongTermDebtAndCapitalLeaseObligationsCurrent
      - ShortTermBorrowings
      - ShortTermDebt
      - CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings
      - CurrentPortionOfLongtermBorrowings
      - ShorttermBorrowings
      - FinanceLeaseLiabilityCurrent
      - ConvertibleDebtCurrent
      - ConvertibleNotesPayableCurrent
      - NotesPayableCurrent
      - OtherNotesPayableCurrent
      - NotesPayableRelatedPartiesClassifiedCurrent
      - SecuredDebtCurrent
      - LinesOfCreditCurrent
    noncurrent:
      - LongTermDebtNoncurrent
      - LongTermDebtAndFinanceLeaseObligationsNoncurrent
      - LongTermDebtAndCapitalLeaseObligations
      - LongTermDebtAndCapitalLeaseObligationsNoncurrent
      - LongtermBorrowings
      - FinanceLeaseLiabilityNoncurrent
      - ConvertibleDebtNoncurrent
      - LongTermNotesPayable
      - NotesPayableRelatedPartiesNoncurrent
      - SecuredDebtNoncurrent
  capex_component_concepts:
    - PaymentsToAcquireBuildings
    - PaymentsToAcquireOtherPropertyPlantAndEquipment
    - PaymentsToAcquireMachineryAndEquipment
    - PaymentsToAcquireFurnitureAndFixtures
    - PaymentsToAcquireLeaseholdImprovements
  composite_debt_concept_rank: 1000

financial_features:
  output_csv: "../output/med_devices_reports/med_device_financial_valuation_features.csv"
  share_count_override_csv: "data/share_count_overrides.csv"
  share_count_sources:
