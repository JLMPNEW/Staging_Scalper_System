stage_plan:
  stage_1:
    name: "data_engineering_api_ingestion_database_build"
    owns_database_build: true
    description: "Build source registry, raw ingestion tables, canonical tables, data-quality tables, and refresh metadata."
  stage_2:
    name: "entity_resolution"
    owns_database_build: false
    description: "Map SEC companies, FDA sponsors/manufacturers, devices, UDI records, reimbursement codes, and clinical-trial sponsors."
  stage_3:
    name: "data_quality_point_in_time_controls"
    owns_database_build: false
    description: "Enforce as-of dates, late-arriving data policy, duplicates, mapping confidence, and leakage checks."
  stage_4:
    name: "financial_and_valuation_features"
    owns_database_build: false
    description: "Build SEC-derived financial quality, valuation, value-trap, calibration bucket, and QA outputs."
  stage_5:
    name: "fda_reimbursement_and_technical_features"
    owns_database_build: false
    description: "Build FDA product-risk, reimbursement, and technical-entry feature sleeves."
  stage_6:
    name: "composite_scoring_and_reporting"
    owns_database_build: false
    description: "Build final med-device daily scores, ranks, classifications, gates, and score-driver diagnostics."
