    - price_to_sales
    - fcf_yield
    - fundamental_quality_score_v1
    - valuation_score_v1
    - value_trap_score

fda_core_ingestion:
  output_csv: "../output/med_devices_reports/med_device_fda_core_ingestion_coverage.csv"
  targeted_footprint_csv: "data/fda_company_footprints.csv"
  source_id: "openfda_device"
  base_url: "https://api.fda.gov/device"
  api_key_env: "OPENFDA_API_KEY"
  api_key_file: "secrets.local.yaml"
  api_key_file_field: "openfda_api_key"
  timeout_sec: 30.0
  max_retries: 3
  parallel_workers: 4
  request_sleep_sec: 0.15
  page_limit: 1000
  commit_every_pages: 10
  # Targeted queries close coverage gaps that rolling broad endpoints can miss.
  # Zero-result searches remain auditable and never become synthetic events.
  targeted_tickers:
    - CERS
    - OSUR
  targeted_include_entity_names: true
  targeted_include_postmarket: true
  targeted_limit: 1000
  manual_approval_evidence_csv: "data/fda_manual_approval_evidence.csv"
  manual_approval_source_id: "fda_accessdata_cber"
  user_agent: "${MED_DEVICES_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}"
  endpoints:
    classification:
      enabled: true
      path: "classification.json"
      # Current catalog is 7,085 rows; retain headroom and fail on future overflow.
      max_records: 10000
      search: ""
      sort: ""
    approvals_510k:
      enabled: true
      path: "510k.json"
      max_records: 25000
      search: ""
      sort: "decision_date:desc"
      date_field: "decision_date"
      window_days: 31
      overlap_days: 45
      initial_lookback_days: 365
    approvals_pma:
      enabled: true
      path: "pma.json"
      max_records: 25000
      search: ""
      sort: "decision_date:desc"
      date_field: "decision_date"
      window_days: 31
      overlap_days: 45
      initial_lookback_days: 365
    recall:
      enabled: true
      path: "recall.json"
      max_records: 25000
      search: ""
      sort: "event_date_initiated:desc"
      date_field: "event_date_posted"
      window_days: 31
      overlap_days: 45
      initial_lookback_days: 365
    enforcement:
      enabled: true
      path: "enforcement.json"
      max_records: 25000
      search: 'product_type:"Devices"'
      sort: "recall_initiation_date:desc"
      date_field: "report_date"
      window_days: 31
      overlap_days: 45
      initial_lookback_days: 365
    adverse_event:
      enabled: true
      path: "event.json"
      max_records: 25000
      search: ""
      sort: "date_received:desc"
      date_field: "date_received"
      window_days: 1
      overlap_days: 14
      initial_lookback_days: 30
      # Some FDA receipt dates are bulk-publication days with >25k MDRs. Numeric
      # key shards are non-overlapping and total-reconciled before watermark advance.
      partition_field: "mdr_report_key"
      partition_width: 10000
      # Global MDR payloads are too large and mostly irrelevant. The collector
      # deterministically expands this template into sorted groups from the
      # governed company-footprint product codes; the unscoped query is never sent.
      scope_product_code_field: "device.device_report_product_code"
      scope_manufacturer_field: "device.manufacturer_d_name"
      scope_group_size: 5

fda_entity_linking:
  output_csv: "../output/med_devices_reports/med_device_fda_entity_mapping.csv"
  min_auto_confidence: 75.0
  high_confidence_threshold: 90.0
  token_score_weight: 100.0
  edit_distance_max_normalized: 0.20
  edit_distance_score: 70.0
  ambiguity_margin: 5.0
  extra_alias_csv: "data/fda_company_aliases.csv"
  footprint_csv: "data/fda_company_footprints.csv"
  manual_overrides_csv: "data/fda_manufacturer_overrides.csv"
  product_line_overrides_csv: "data/fda_product_line_overrides.csv"
  max_candidate_summary: 5
  high_volume_unmapped_record_threshold: 50
  update_fact_company_ids: true

fda_mapping_governance:
  run_after_linking: true
  fail_on_critical: true
  source_mapping_csv: "../output/med_devices_reports/med_device_fda_entity_mapping.csv"
  output_csv: "../output/med_devices_reports/fda_mapping_review_queue.csv"
  manual_overrides_csv: "data/fda_manufacturer_overrides.csv"
