sec_fundamentals:
  submissions_url_template: 'https://data.sec.gov/submissions/CIK{cik}.json'
  submissions_archive_url_template: 'https://data.sec.gov/submissions/{file_name}'
  companyfacts_url_template: 'https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json'
  user_agent: '${BASIC_MATERIALS_SEC_USER_AGENT:-JL, Independent Research, jm.357@hotmail.com}'
  request_interval_seconds: 0.12
  timeout_seconds: 30
  max_retries: 4

runtime:
  sqlite_timeout_seconds: 30
  fail_closed: true
  allow_cross_sector_imports: false
  require_manifest_match_before_mutation: true
  require_database_identity: true

