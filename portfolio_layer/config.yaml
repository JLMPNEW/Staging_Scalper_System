# Portfolio layer configuration. All paths resolve under Staging_Scalper_System and never
# reach into PROD_Scalper_System. Override the DB directory via PORTFOLIO_LAYER_DB_DIR.
paths:
  database_path: "${PORTFOLIO_LAYER_DB_DIR:-db}/portfolio_layer.sqlite"
  output_dir: "output"
  cache_dir: "output/cache"
  macro_serving_db_path: "MacroLayer/macro_serving.sqlite"

runtime:
  sqlite_timeout_sec: 120.0

# Stage 1 - canonical cross-sector stocks_scores contract.
# Adapters read each sector's published score CSV (never its DB) and map onto the contract.
# calibration.expected_alpha_at_full = provisional annualized alpha at native score==100; empirical
# IC re-calibration against the Stage 2 return panel refines these slopes later.
score_contract:
  contract_version: "stocks_scores_v1"
  sector_output_root: "../output"        # repo-level output/ tree (relative to this config)
  staleness_tolerance_days: 10
  min_successful_sectors: 6              # fail collection if fewer enabled production sectors publish usable rows
  native_score_range: {min: 0.0, max: 100.0}
  max_abs_expected_alpha: 1.0             # hard sanity bound for calibrated final_score annual alpha
  # When a ticker is scored by >1 sector, force it to its canonical source pipeline before the
  # confidence/order tie-break (keeps sector pipelines untouched). ticker -> canonical_pipeline.
  canonical_pipeline_overrides_csv: "data/canonical_sector_overrides.csv"
  rating_bands:                          # within-sector percentile floor -> rating label
    strong_buy: 90.0
    buy: 70.0
    hold: 40.0
    reduce: 20.0
    avoid: 0.0
  sectors:
    - model_family: semiconductors
      adapter: tech_family
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Information Technology"
      industry: "Semiconductors"
      industry_aggregate: "Semiconductors & Semiconductor Equipment"
      file_mode: dated
      file_path: "technology_reports/semi_dashboard/{yyyy-mm-dd}/semiconductor_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    - model_family: software_infrastructure
      adapter: tech_family
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Information Technology"
      industry: "Software"
      industry_aggregate: "Software & Services"
      file_mode: dated
      file_path: "technology_reports/software_infrastructure/dashboard/{yyyy-mm-dd}/software_infrastructure_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    - model_family: technology_hardware
      adapter: tech_family
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Information Technology"
      industry: "Technology Hardware"
      industry_aggregate: "Technology Hardware & Equipment"
      file_mode: dated
      file_path: "technology_reports/technology_hardware/dashboard/{yyyy-mm-dd}/technology_hardware_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    - model_family: biotech
      adapter: biotech
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Health Care"
      industry: "Biotechnology"
      industry_aggregate: "Pharmaceuticals, Biotechnology & Life Sciences"
      file_mode: dated
      file_path: "biotech_index_reports/{yyyymmdd}/biotech_daily_scores.csv"
      zero_score_is_missing: true
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.20}
    - model_family: med_devices
      adapter: med_devices
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Health Care"
      industry: "Health Care Equipment"
      industry_aggregate: "Health Care Equipment & Services"
      file_mode: dated
      file_path: "med_devices_reports/score_review_pack/{yyyy-mm-dd}/med_device_daily_composite_scores.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    # Defense is a production OOS sleeve after the weekly 2019-2026 PIT calibration
    # promotion. require_oos_score_valid remains true so a stale or shadow publish
    # fails closed at the adapter.
    - model_family: defense
      adapter: tech_family
      enabled: true
      required: true
      staleness_tolerance_days: 3
      sector: "Industrials"
      industry: "Aerospace & Defense"
      industry_aggregate: "Aerospace & Defense"
      file_mode: dated
      file_path: "industrials/defense/dashboard/{yyyy-mm-dd}/defense_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    # Machinery remains an enabled optional shadow source until its OOS calibration
    # is sealed. The adapter ingests rows for diagnostics but cannot size them.
    - model_family: machinery
      adapter: industrial_family
      enabled: true
      required: false
      staleness_tolerance_days: 3
      sector: "Industrials"
      industry: "Machinery"
      industry_aggregate: "Machinery"
      file_mode: dated
      file_path: "industrials/machinery/dashboard/{yyyy-mm-dd}/machinery_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}
    # Transportation is connected as an optional shadow source. It remains
    # allocation-ineligible until its dated ranks carry a valid sealed OOS score.
    - model_family: transportation
      adapter: industrial_family
      enabled: true
      required: false
      staleness_tolerance_days: 3
      sector: "Industrials"
      industry: "Transportation"
      industry_aggregate: "Transportation"
      file_mode: dated
      file_path: "industrials/transportation/dashboard/{yyyy-mm-dd}/transportation_final_rank_table.csv"
      require_oos_score_valid: true
      calibration: {neutral: "median", scale: 50.0, expected_alpha_at_full: 0.15}

# Stage 2 - live/current-book cross-sector risk panel (self-sourced, NOT survivorship history).
risk_panel:
  price_provider: "yahoo_adjusted"
  adjustment_policy: "yahoo_adjclose_div_split"   # Yahoo adjusted close = dividend + split adjusted
  master_calendar_ticker: "SPY"                   # benchmark calendar = US master trading calendar
  lookback_trading_days: 504
  min_direct_history_days: 252                     # >= -> risk_status=direct
  hard_floor_history_days: 60                      # < -> risk_status=excluded (risk_eligible=0)
  max_missing_day_fraction: 0.10                   # max fraction of master-calendar days a ticker may miss
  max_stale_price_trading_days: 0                  # missing right-edge bars beyond this exclude risk sizing
  same_day_bar_final_after_et: "17:00"             # never seal a current-session Yahoo daily bar before this
  market_timezone: "America/New_York"
  readiness_stale_status: "FAIL"                   # stale/missing required sectors block Stage 2 by default
  covariance_frequency: "daily"                    # daily | weekly
  shrinkage_method: "pairwise_linear"              # pairwise_linear (ragged-panel safe) | ledoit_wolf | oas
  shrinkage_intensity: 0.20                         # linear shrink toward diagonal (preserves correlations)
  max_abs_return_for_covariance: 0.0                # 0 = NO blanket cap: real catalyst variance is preserved
                                                    # (Rank IC / MI need it). Corruption is handled only via the
                                                    # split-aligned detector + explicit quarantine, never a cap.
  split_jump_threshold: 0.4                          # |daily return| above this is reviewed by the detector
  split_review_window_days: 7                        # flag a jump as suspect ONLY if a split event is within +/- days
  split_artifact_abs_tolerance: 0.15                  # abs diff vs raw split-implied return
  split_artifact_rel_tolerance: 0.25                  # relative diff vs raw split-implied return
  cluster_distance_threshold: 0.5                   # 1 - corr distance at which names merge
  max_condition_number: 1.0e7                       # realistic for a ~430-name daily covariance
  ticker_aliases:                                   # contract ticker -> active market-data symbol
    PSTG:
      active_ticker: P
      predecessor_ticker: PSTG
      effective_date: "2026-04-17"
      price_history_csv: "data/price_lineage_p.csv"
      issuer_id: "CIK0001474432"
      reason: "Pure Storage/Everpure same-issuer ticker migration; stitch PSTG history into active P"
    P:
      active_ticker: P
      predecessor_ticker: PSTG
      effective_date: "2026-04-17"
      price_history_csv: "data/price_lineage_p.csv"
      issuer_id: "CIK0001474432"
      reason: "Pure Storage/Everpure active ticker; stitch PSTG history before P effective date"
  benchmark_tickers: [SPY, QQQ, SMH, SOXX, XBI, XLK, XLV, XLF, XLE, XLI, XLP, XLY, XLU, XLB, XLRE, XLC, XAR, ITA, VIS]
  hedge_rotation_etfs: [IGV, IHI, XAR, MCHI, FXI, INDA, EWZ, EWG, EWY, EWT, IEMG]
  sector_etf_map:                                  # source_pipeline -> shrinkage-target ETF
    semiconductors: SOXX
    software_infrastructure: IGV
    technology_hardware: XLK
    biotech: XBI
    med_devices: IHI
    defense: XAR
    machinery: XLI
  fetch:
    chart_url_templates:
      - "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
      - "https://query2.finance.yahoo.com/v8/finance/chart/{ticker}"
    enable_stooq_fallback: false              # Stooq closes are not dividend-adjusted; diagnostic only
    max_workers: 10
    request_timeout_sec: 20
    max_retries: 3
    master_calendar_retry_attempts: 3        # extra targeted retries if SPY/primary calendar failed in batch
    master_calendar_retry_sleep_sec: 5.0
    user_agent: "portfolio_layer/0.1 (+research)"

# Optional Stage 2.5 - intraday liquidity panel.
# When the enhanced panel is inactive, Stage 4 uses transaction_costs.half_spread_bps_default.
# When enabled, the overnight process connects to IB/TWS or IB Gateway and requests historical BID_ASK
# 5-minute bars, then stores sampled half-spreads as CSV artifacts and in the portfolio-owned SQLite DB.
liquidity_panel:
  enhanced_intraday_enabled: true
  provider: "ibkr_historical_bid_ask"
  universe_source: "risk_eligible_scores"   # risk_eligible_scores | investable_scores | target_weights | trade_list | auto
  bar_size: "5 mins"
  duration_days: 5                         # permits backfill if one overnight run is missed
  use_rth: true
  sample_times_et: ["11:00", "13:30", "15:30"]
  max_sample_lag_minutes: 12
  max_stale_liquidity_days: 5              # use latest available sample within this window before falling back
  min_valid_samples: 2
  fallback_half_spread_bps: 5.0             # used only when fallback is explicitly allowed
  allow_fallback_to_default: true
  max_universe_fallback_fraction: 0.10      # max share of full liquidity universe allowed to use fallback
  max_fallback_fraction: 0.10               # max share of traded names allowed to use fallback in Stage 4
  request_pause_sec: 2.0
  max_retries: 3
  ticker_aliases:
    HEI-A:
      ib_symbol: "HEI A"
      display_symbol: "HEI.A"
      compact_symbol: HEIA
      issuer_id: "CUSIP422806208"
      reason: "IBKR/TWS class-share contract symbol for HEICO Class A"
    MOG-A:
      ib_symbol: "MOG A"
      display_symbol: "MOG.A"
      compact_symbol: MOGA
      issuer_id: "CUSIP615394202"
      reason: "IBKR/TWS class-share contract symbol for Moog Class A"
    MOG-B:
      ib_symbol: "MOG B"
      display_symbol: "MOG.B"
      compact_symbol: MOGB
      issuer_id: "CUSIP615394301"
      reason: "IBKR/TWS class-share contract symbol for Moog Class B"
  ib:
    host: "127.0.0.1"
    port: 7497                              # TWS paper default; use 7496 for live TWS if appropriate
    client_id: 41
  audit:
    half_spread_warn_bps: 50.0              # surfaced for review; not an optimizer exclusion
    half_spread_fail_bps: 1000.0            # hard data-quality failure
    trade_weighted_half_spread_warn_bps: 20.0
    trade_weighted_half_spread_fail_bps: 100.0

# Stage 3 - AQR-only baseline book (long-only mean-variance on the INJECTED Stage 2 covariance).
optimizer:
  objective: "mean_variance"
  long_only: true
  covariance_source: "stage2"            # inject Stage 2 risk/covariance.csv; never rebuild from prices
  use_confidence_adjusted_mu: true        # mu_used = final_score * score_confidence (both annualized)
  risk_aversion: 5.0                       # gamma in maximize mu'w - 0.5*gamma*w'Sigma*w
  gross_exposure: 1.0                      # fully invested, long-only
  max_weight_per_name: 0.05               # per-name cap
  min_weight_to_hold: 0.0005              # drop dust weights below this then renormalize
  solver: "ECOS"                           # fallback order: ECOS -> OSQP -> SCS
  sensitivity_band_gammas: [2.5, 5.0, 10.0]  # per-name weight band = min/max across these risk-aversions
  sector_weight_caps:                      # source_pipeline -> max share of gross in the LIVE Stage 3 book.
    # Defense is a newly promoted sleeve: hold it to a 5% shadow-to-live pilot (matches its BL strategic
    # weight) instead of distorting its alpha anchor. Set 0.0 to exclude it from sizing entirely.
    # Research/shadow books (walk-forward arms, BL, sleeve diagnostics) are intentionally UNCAPPED —
    # a larger live budget is earned through Stage 7/BL fusion + Stage 11 calibration evidence.
    defense: 0.05
    machinery: 0.00
    # deployable-book concentration/cash/liquidity policy 2026-07-20: cap the tech sleeves so the LIVE
    # book cannot over-concentrate in Information Technology (consumed ONLY by optimizer 09/10).
    software_infrastructure: 0.25
    semiconductors: 0.15
    technology_hardware: 0.12
  # deployable-book concentration/cash/liquidity policy 2026-07-20: pre-solve liquidity floor — names
  # whose run-dir risk/spread_snapshot.csv median_half_spread_bps exceeds this are excluded from sizing
  # (fail-open: a missing snapshot or missing/blank row never excludes). Optimizer 09 only.
  max_half_spread_bps: 50

# Stage 4 - transaction-cost & turnover overlay (flat per-order commission, AUM-aware). Stage 3 unchanged.
transaction_costs:
  aum_usd: 300000                          # REQUIRED (CLI --aum overrides); flat commission is AUM-dependent
  # deployable-book concentration/cash/liquidity policy 2026-07-20: hold a fixed CASH buffer in the
  # deployable book. Stage 4 (14_apply_no_trade_bands) scales the asset block by (1 - fraction) and
  # routes the freed weight to CASH so assets+cash still close to gross=1.0. Optimizer gross stays 1.0.
  cash_target_fraction: 0.05
  commission_per_order:                    # one name . one side = one order (buy=1, sell=1)
    low: 1.00
    base: 1.125                            # reported/sealed assumption
    worst_case: 1.25                       # used for conservative trade/no-trade decisions
  rebalance_horizon_days: 21
  no_trade_buffer_drag: 0.0                # extra buffer added to cost in the utility>cost test (weight units)
  enable_provisional_mu_no_trade: false    # Stage 11 turns on realized-alpha-calibrated utility gating
  half_spread_bps_default: 5.0             # provisional (config) until bid/ask data exists
  spread_source: "auto"                    # auto | config_default | liquidity_panel
  # auto: use the collected IB spread snapshot when risk/05c has run for the date, else fall back to
  # the flat half_spread_bps_default (fallback is recorded as spread_mode=config_default, never
  # silent). Set to "liquidity_panel" for strict live trading that must fail closed on a missing
  # snapshot; "config_default" to force flat spreads always.
  impact_model: "none"                     # none | sqrt_adv (deferred; needs volume)
  min_position_commission_fraction: 0.005  # drop position to CASH if commission > this fraction of its notional
  decision_commission: "worst_case"        # which commission drives trade/no-trade economics

# Stage 5 - tactical rotation sleeve (SHADOW-ONLY: never mutates the Stage 3/4 live book this stage).
# Time-series money-flow tilt across sector ETFs (and foreign ETFs, held at zero budget until Stage 6).
# Signals are computed from the sealed Stage 2 returns/price panel - no new fetch, fully PIT.
rotation:
  enabled_in_production: false              # HARD shadow-only; promotion waits for Stage 7 fusion + Stage 11 OOS
  # Broad sector context to rank against (so a strong sleeve in a weak tape still gets a moderate percentile).
  rank_universe_etfs: [XLK, XLV, XLF, XLE, XLI, XLP, XLY, XLU, XLB, XLRE, XLC, SOXX, IGV, XBI, IHI, XAR]
  momentum_windows_days: [21, 63, 126]      # multi-horizon total-return momentum
  momentum_weights: [0.5, 0.3, 0.2]         # blend weights (normalized internally)
  trend_filter:
    ma_days: 200                            # absolute-trend gate: price vs long MA
    slope_lookback_days: 21                 # MA slope sign measured over this lookback
  state_thresholds:
    positive_score_pct: 60.0                # >= and trend up -> Positive
    negative_score_pct: 40.0                # <= -> Negative (also forced Negative if trend gate fails)
  tilt:
    mult_min: 0.7                           # bounded multiplicative tilt on a sleeve's aggregate weight
    mult_max: 1.3
    max_sector_budget_shift: 0.30           # |tilted - base| sector weight share cap
  foreign:
    applied_budget: 0.0                     # LOCKED to 0 until macro country-fit (Stage 6)
    eligible_score_pct: 55.0                # >= and trend up -> Eligible, else Avoid
    market_map:                             # foreign universe + MarketName (country/region label)
      MCHI: China
      FXI: China
      INDA: India
      EWZ: Brazil
      EWG: Germany
      EWY: South Korea
      EWT: Taiwan
      IEMG: Emerging Markets
  ablation_window_days: 126                 # trailing window for the diagnostic net-of-cost replay (19)
  ablation_min_trade_notional_usd: 1.0      # do not charge flat commission on numerical dust deltas
  net_sharpe_degradation_tolerance: 0.0     # diagnostic status WARN if AQR+rotation degrades beyond this

# Stage 6 - macro regime / macro-fit contract (SHADOW-ONLY).
# MacroLayer remains a vendored independent engine under portfolio_layer/MacroLayer. Stage 6 adapts its
# serving DB into portfolio-native artifacts keyed to the five source_pipeline sleeves. It never overwrites
# Stage 1 stocks_scores.csv or Stage 3/4/5 live-book artifacts; Stage 7 consumes the sealed macro contract.
macro:
  enabled_in_production: false
  vendor_root: "MacroLayer"
  regime_source: "v1"                       # v1 | v2 | h1; candidates are fail-closed on sealed PROMOTABLE evidence
  candidate_regime_source: "h1"             # tracked candidate: H1 hybrid (H1_CANDIDATE_SPEC.md, prospective-only)
  regime_v2_model_version: "macro_regime_v2_independent_outcomes_v1"
  regime_h1_model_version: "macro_regime_h1_hybrid_v1"
  freshness_tolerance_days:
    regime: 5
    country_fit: 30
    sector_fit: 30
    industry_fit: 30
    industry_aggregate_fit: 30
    stock_fit: 30
    foreign_budget: 30
    foreign_candidates: 30
  max_stock_fallback_fraction: 0.50          # max share of stocks_scores names allowed to use sleeve fallback
  max_eligible_stock_fallback_fraction: 0.40 # max share of investable_eligible names allowed to use sleeve fallback
  require_all_sleeves: true
  stock_fallback_policy: "stock_then_industry_then_aggregate_then_sector"
  sleeve_taxonomy:
    biotech:
      macro_sector_fallback: "Health Care"
      industries: ["Biotechnology", "Diagnostics & Research", "Drug Manufacturers - General", "Drug Manufacturers - Specialty & Generic", "commercial_profitable_quality_or_mature", "commercial_turnaround_or_unprofitable_growth", "early_clinical_speculative_or_single_asset_pipeline", "late_clinical_pivotal_or_registrational", "platform_partnered_modality_pipeline"]
      industry_aggregates: ["Pharmaceuticals, Biotechnology & Life Sciences", "Healthcare: Biopharma & Research Tools"]
    med_devices:
      macro_sector_fallback: "Health Care"
      industries: ["Medical Devices", "Medical Instruments & Supplies"]
      industry_aggregates: ["Health Care Equipment & Services", "Healthcare: Providers, Plans, MedTech & Distribution"]
    semiconductors:
      macro_sector_fallback: "Information Technology"
      industries: ["Semiconductors", "Semiconductor Equipment & Materials"]
      industry_aggregates: ["Semiconductors & Semiconductor Equipment", "Semiconductors & Electronic Components"]
    software_infrastructure:
      macro_sector_fallback: "Information Technology"
      industries: ["Software", "Software - Infrastructure", "Software - Application", "Information Technology Services"]
      industry_aggregates: ["Software & Services", "Software & IT Services"]
    technology_hardware:
      macro_sector_fallback: "Information Technology"
      industries: ["Technology Hardware", "Computer Hardware", "Consumer Electronics", "Communication Equipment", "Electronic Components", "Scientific & Technical Instruments"]
      industry_aggregates: ["Technology Hardware & Equipment", "Tech Hardware & Instruments"]
    defense:
      macro_sector_fallback: "Industrials"
      industries: ["Aerospace & Defense"]
      industry_aggregates: ["Aerospace & Defense"]
    machinery:
      macro_sector_fallback: "Industrials"
      industries: ["Machinery", "Specialty Industrial Machinery", "Farm & Heavy Construction Machinery", "Building Products & Equipment"]
      industry_aggregates: ["Machinery"]

# Stage 7 - Black-Litterman fusion (SHADOW-ONLY adapter over the vendored optimizer).
# Units = annualized (option B): only Stage 1 final_score becomes an expected-return view; rating/state/
# regime adjust confidence/gross/budgets/multipliers, never injected as returns. The generated tier1 config
# derives its return frequency from Stage 2 covariance metadata, so annual alpha and annual covariance are
# converted into the same optimizer period.
black_litterman_fusion:
  enabled_in_production: false
  tau: 0.05
  delta: 2.5                                # equilibrium prior pi = delta * Sigma * w_bench
  risk_aversion: 5.0                        # gamma of the Stage 7 tier1 BL solve (independent of optimizer.risk_aversion)
  return_space: "excess"                    # no explicit CASH asset in the Stage 7 baseline
  alpha_units_policy: "B_annualized_calibrated"   # preserve Stage 1 calibrated annual alpha (no z-rescale)
  base_gross_exposure: 1.0
  max_weight_per_name: 0.05
  confidence_by_rating:                     # rating -> BL view confidence (-> Omega); NOT a return
    strong_buy: 0.90
    buy: 0.70
    hold: 0.50
    reduce: 0.35
    avoid: 0.20
  min_confidence: 0.15
  max_confidence: 0.95
  score_confidence_boost: 0.10
  sector_state_alpha_multipliers:           # rotation State -> bounded sector alpha tilt (NOT a return)
    Positive: 1.0
    Neutral: 0.0
    Negative: -0.5
  sector_alpha_scale_annual: 0.03           # annual magnitude of the rotation/macro sector tilt
  macro_sector_baseline_source: "strategic_weights"  # strategic_weights | stage3_weights | eligible_count
  strategic_sector_weights:                 # neutral sleeve policy before bounded macro/rotation tilts
    biotech: 0.285
    med_devices: 0.095
    semiconductors: 0.2375
    software_infrastructure: 0.19
    technology_hardware: 0.1425
    defense: 0.05
    machinery: 0.00
  benchmark_within_sector_source: "equal"   # equal | stage3_weights; ticker-level BL prior inside each sleeve
  macro_sector_shift_mode: "relative_with_floor"
  macro_sector_max_shift: 0.10              # absolute safety cap on |shift| before projection
  macro_sector_max_relative_shift: 0.50     # max |shift| as a fraction of the chosen sleeve baseline
  macro_sector_min_weight_floor: 0.005      # small sleeve floor; bounded by baseline to avoid artificial new budget
  macro_sector_shift_scale: 0.05            # macro_fit_z -> budget shift (pre-clip)
  macro_sector_cap_band: 0.03               # tier1 sector exposure band around macro-shifted benchmark weights
  regime_to_gross_scalar:                   # macro regime -> gross-exposure multiplier
    # The live regime vocabulary (V1 decision layer and all v2-family/H1 candidates) is the
    # four-quadrant set below — each entry EXPLICIT per H1_CANDIDATE_SPEC.md downstream
    # preconditions (H1 surfaces HEATING_UP/EXPANSION_DISINFLATION far more often than V1 did).
    EXPANSION_DISINFLATION: 1.00            # goldilocks quadrant: full gross (mirrors legacy EXPANSION)
    HEATING_UP: 1.00                        # validated-supportive regime (research/71-72); full gross
    SLOW_GROWTH: 0.85
    STAGFLATION: 0.70
    # Legacy labels retained for backward compatibility; no current regime source emits them.
    EXPANSION: 1.00
    RECOVERY: 1.00
    CONTRACTION: 0.50
    CRISIS: 0.40
    default: 0.85
  foreign_activation_policy: "respect_active_flag"   # allocate foreign only if macro active_flag==1

# Stage 8 - multi-horizon sleeves + risk-allocation engine (SHADOW-ONLY proposal over the Stage 7 book).
# Re-allocates RISK (not capital): factor-neutralized, diversified (effective bets), risk where IR is
# highest, regime-conditional sleeve budgets. Phase 1: long_core + medium_rotation only; short_catalyst
# disabled until events/catalyst_events.csv exists. Gross is NOT re-scaled (Stage 6/7 own it via regime).
sleeves:
  enabled_in_production: false
  # --- risk model (multi-factor straight from the sealed Stage 2 covariance, which contains these ETFs) ---
  market_factor_etf: "SPY"
  sector_factor_etfs:                        # source_pipeline -> sector factor ETF (mirrors risk_panel.sector_etf_map)
    semiconductors: "SOXX"
    software_infrastructure: "IGV"
    technology_hardware: "XLK"
    biotech: "XBI"
    med_devices: "IHI"
    defense: "XAR"
    machinery: "XLI"
  factor_risk_caps:
    min_idiosyncratic_share: 0.50            # >= this share of book variance must be idiosyncratic
    max_market_share: 0.25                   # market-beta risk share cap
    max_sector_share: 0.25                   # per sector-factor risk share cap
  effective_bets:
    min_enb: 10.0                            # Meucci ENB floor (also >= min_enb_fraction * N_held)
    min_enb_fraction: 0.35
  per_name_risk_contribution_cap: 0.08       # max share of portfolio variance from one name
  ir_outlier_z: 3.0                          # WARN if a name's RC/IR is an outlier beyond this z
  # --- sleeve definitions ---
  sleeve_defs:
    short_catalyst: {enabled: false, horizon_months: [1, 3]}   # Phase 1 disabled; needs event contract
    medium_rotation: {rotation_state: "Positive", horizon_months: [3, 6]}
    long_core: {driver: "final_score", horizon_months: [6, 18]}
  catalyst_events_csv: "events/catalyst_events.csv"            # run-local under runs/<as_of>/; absent => WARN+disable
  # --- regime-conditional sleeve risk budgets (share of total book variance) ---
  sleeve_risk_budgets:
    default: {long_core: 0.65, medium_rotation: 0.35, short_catalyst: 0.0}
    risk_off: {long_core: 0.80, medium_rotation: 0.20, short_catalyst: 0.0}   # STAGFLATION/CONTRACTION/CRISIS
  # Explicit regime treatment (H1_CANDIDATE_SPEC.md audit): of the live four-quadrant
  # vocabulary, only STAGFLATION is risk_off; HEATING_UP, EXPANSION_DISINFLATION, and
  # SLOW_GROWTH INTENTIONALLY use the default budget (gross de-risking for SLOW_GROWTH is
  # owned by black_litterman_fusion.regime_to_gross_scalar, not sleeve budgets).
  # CONTRACTION/CRISIS are legacy labels no current regime source emits.
  risk_off_regimes: ["STAGFLATION", "CONTRACTION", "CRISIS"]
  sleeve_risk_budget_band: 0.05              # +/- tolerance on realized sleeve risk share
  # --- within-sleeve allocation ---
  within_sleeve_ir_tilt: 0.50               # 0 = equal risk contribution (risk parity); 1 = full IR tilt
  max_weight_per_name: 0.05                  # inherit Stage 3 per-name cap
  # --- drawdown throttle (Phase 1 = simulated/diagnostic only, NOT applied) ---
  drawdown_throttle:
    apply: false                             # Phase 2 machinery is live: measured dd + state chain +
                                             # ratcheted recovery; flip to true to APPLY the scale to
                                             # the proposal (activation awaits Stage 11 promotion)
    dd_limit: 0.15
    window_trading_days: 63                  # trailing window for the measured proposal drawdown
    min_complete_fraction: 0.80              # fail closed if fewer complete held-name return rows exist
    recovery_step_per_run: 0.25              # applied scale may rise at most this much per run
  # --- iterative scale->project loop ---
  projection:
    max_iterations: 50
    rc_tolerance: 0.01                       # converged when max |sleeve RC share - budget| < this

# Stage 8.5 - holdings ledger / broker statement ingestion.
# The raw source is a sealed IB Activity Statement CSV saved under IB_reports/.
# Live IB access is intentionally not part of the core portfolio pipeline.
holdings_ledger:
  enabled_in_production: false
  source_reports_dir: "../IB_reports"
  statement_glob: "U*.csv"
  broker: "IBKR"
  manual_lot_overrides:
    FISV:
      - asset_category: "Stocks"
        quantity: 100
        entry_date: "2025-10-29"
        reason: "User-confirmed entry date for pre-report FISV lot; basis inferred from IB aggregate cost basis."

# Stage 9 - exit engine over ACTUAL ledger holdings (SHADOW-ONLY).
# Phase 1 is equities-only and decides what to do with positions already held. It does not create buys
# and does not force the actual book into the Stage 8 target; target gaps are diagnostic only.
exit_engine:
  enabled_in_production: false
  phase: "phase1_actual_equity_holdings"
  # scope, signal source, and target-gap source are FIXED behaviors of exits/33 (ledger actual
  # holdings; latest sealed scores <= ledger as-of; Stage 8 sleeve proposal, diagnostic only) —
  # documented here as comments, not knobs, so nobody edits a value that nothing reads.
  max_signal_lag_days: 10
  # Stage 9 Phase 2 (exits/36): price-stop PROBE thresholds — diagnostic flags only, exits stay
  # score-driven until Stage 11 evidence says otherwise
  price_stop_probe:
    loss_vs_cost_pct: 0.25                  # flag if mark <= (1 - this) * FIFO average cost
    drawdown_vs_high_pct: 0.20              # flag if mark <= (1 - this) * trailing high
    trailing_high_lookback_days: 126
  actions:
    hard_exit_fraction: 1.0
    soft_exit_fraction: 0.5
  score_decay:
    use_rating_for_exit: false
    hard_exit_final_score_below: -0.15
    soft_exit_final_score_below: -0.10
    hard_exit_ratings: ["avoid"]     # legacy fallback only when use_rating_for_exit=true
    soft_exit_ratings: ["reduce"]    # legacy fallback only when use_rating_for_exit=true
    review_final_score_below: -0.05
    min_score_confidence_review: 0.25
  coverage_policy:
    not_scored_action: "review"
    scored_not_investable_action: "soft_exit"
    option_action: "unsupported_phase1"
  position_risk:
    review_unrealized_loss_pct: -0.35
    review_actual_weight_pct: 0.15
  catalyst_events_csv: "events/catalyst_events.csv"  # absent => WARN+disable catalyst time-stops in Phase 1

# Stage 11 - lockbox window declaration (machine-readable mirror of docs/LOCKBOX_PROTOCOL.md).
# The protocol document is CANONICAL; Stage 11 scripts (65/66/16) must verify this block matches the
# protocol and refuse to run on divergence. Governance is NOT symmetric across fields:
#   - dev_window_start may move EARLIER freely as older sector history is generated (expanding dev
#     data backward never contaminates the sealed window).
#   - dev_window_end / sealed_start move ONLY via a dated append-only entry in the protocol's
#     Amendment Log (e.g., declaring a new lockbox cycle after an Open Event) — never edited ad hoc.
#   - lockbox_opened flips true only when an Open Event entry exists in the Amendment Log.
stage11_lockbox:
  protocol_doc: "docs/LOCKBOX_PROTOCOL.md"
  declared: "2026-06-27"
  dev_window_start: "2019-01-04"           # moved earlier 2026-07-03 (see protocol Amendment Log)
  dev_window_end: "2025-12-31"
  sealed_start: "2026-01-01"          # sealed through the Open Event; no fixed right edge
  lockbox_opened: false
  training_label_end_max: "2025-12-31"  # purge rule: promoted models train only on labels ending <= this

# Earnings-date calendar feed (earnings_dates/37,38). Advisory data only: nothing downstream
# consumes it yet; the history CSV accrues a PIT record of scheduled dates from the day it turns on.
earnings_dates:
  include_non_investable: true            # bulk fetch covers all scored names at no extra API cost
  alpha_vantage:
    horizon: "12month"
    api_key_env: ["ALPHAVANTAGE_API_KEY", "ALPHA_VANTAGE_API_KEY"]
    timeout_sec: 120.0
  yahoo:
    enabled: true
    max_calls_per_run: 400                # fallback only fires for names the bulk calendar misses
    request_pause_sec: 1.0
  gemini:
    enabled: true                         # free tier only: hard cap + pacing below, never bulk usage
    model: "gemini-2.5-flash"
    api_key_env: ["GEMINI_API_KEY", "GOOGLE_API_KEY"]
    max_calls_per_run: 15
    request_pause_sec: 6.5                # ~9 requests/minute stays under free-tier RPM
  validation:
    min_coverage_fraction_investable: 0.60  # WARN below this; reports >90d out are often unpublished
    max_days_until: 400

# Stage 11 - PIT snapshot store (research/65). Immutable append-only archive of sealed Stage 1 runs.
snapshot_store:
  dir: "snapshot_store"                 # under paths.output_dir
  live_max_generation_lag_days: 5       # run generated within N days of as-of => provenance=live, else reconstructed
  native_median_drift_warn: 20.0        # WARN when a sector's native median jumps more than this between snapshots
  row_count_drop_warn_fraction: 0.5     # WARN when a sector's row count drops below this fraction of the prior snapshot

# Stage 11 - survivorship-complete research price panel (backtest/15b). NOT the Stage 2 live panel.
survivorship_panel:
  dir: "survivorship_panel"                # under paths.output_dir; one sealed subdir per build date
  history_buffer_calendar_days: 400        # warmup before min(dev_window_start, earliest snapshot):
                                           # ~275 trading days, so the FIRST snapshot already has a full
                                           # 252d trailing-beta window and the rotation 200d-MA + 21d
                                           # slope history (was 40 during the short-span infra tests)
  stale_tail_trading_days: 5               # last bar within N master-calendar rows of panel end => active
  delist_match_trading_days: 10            # last bar within ~N trading days of delist date => delisted_covered
  overlap_disagreement_warn_rel: 0.02      # Yahoo-vs-export adjclose relative diff to flag (adjustment mismatch)
  min_complete_fraction_warn: 0.95         # WARN when a sector's survivorship-complete share is below this
  active_cache_max_age_days: 7             # refresh live names so later splits cannot stale-adjust cached history
  delisted_price_export_globs:             # published sector price exports (docs/delisted_price_export_contract.md)
    - "../output/*_reports/market_data/*delisted_price_export.csv"
  delisting_events_globs:
    - "../output/*_reports/market_data/*delisting_events.csv"
  delisting_hint_report_globs:             # existing Norgate import REPORTS (delist-date hints only, no prices)
    - "../output/*_reports/market_data/norgate_delisted*price_import.csv"

# Stage 11 - adjusted-OHLC execution panel (backtest/15c). The sealed 15b close remains
# authoritative. Yahoo raw OHLC is adjusted and normalized to that close; missing opens
# are never replaced with closes. Delisted exports may add adj_open/adj_high/adj_low.
execution_ohlcv_panel:
  dir: "execution_ohlcv_panel"
  close_disagreement_tolerance: 0.02
  ticker_complete_fraction: 0.95

# Stage 11 - forward-return calibration targets (research/66). Lockbox-enforced.
calibration_targets:
  dir: "calibration_targets"               # under paths.output_dir; one subdir per panel build date
  horizons_trading_days: [21, 63, 126, 252]
  drawdown_horizon_trading_days: 63
  beta_lookback_trading_days: 252          # trailing daily-return window ENDING at the entry bar (PIT)
  beta_min_observations: 60
  max_entry_lag_trading_days: 5            # entry bar must be within N rows of the snapshot as-of
  realized_vol_min_observations: 10        # min forward daily returns for the realized-vol label

# Stage 11 - calibration panel (research/67): PIT state joins + standardization onto the 66 targets.
# Regime/sector-fit/stock-fit/foreign-budget come from the read-only macro serving DB (<= as-of);
# rotation state is recomputed from the survivorship panel sliced to <= as-of via the Stage 5 pure
# functions. Optional joins (run-dir risk/liquidity/sleeves, tech sidecars) are availability-flagged.
calibration_panel:
  dir: "calibration_panel"                 # under paths.output_dir; one subdir per targets build
  rotation_lookback_trading_days: 504      # panel slice fed to the rotation builders (>= ma_days + slope)

# Stage 11 - first-pass empirical alpha calibration (research/68). RESEARCH ONLY: approved slopes
# feed Stage 1 / Stage 7 only after Stage 11 OOS validation (69/16) passes. Approval is deliberately
# conservative — overlapping forward windows are not independent evidence, so short test spans
# reject with insufficient_independent_windows by design.
alpha_calibration:
  dir: "alpha_calibration"                 # under paths.output_dir; one subdir per panel build
  target: "excess_sector"                  # excess_sector | excess_spy | raw | resid_sector
  ridge_shrinkage: 0.25                    # pooled slope = sum(zy) / (sum(z^2) + shrinkage*n)
  min_cross_section_names: 8               # per-date Fama-MacBeth regressions need this many names
  min_observations: 200                    # approval floor: pooled rows per (pipeline, horizon)
  min_dates: 8                             # approval floor: usable snapshot dates
  min_independent_windows: 3               # approval floor: non-overlapping label windows in the span
  approve_t_min: 2.0                       # |Fama-MacBeth t| must reach this
  min_sign_consistency: 0.55               # fraction of per-date slopes agreeing with the mean sign

# Stage 11 - purged walk-forward validation of the calibration (research/69). Train folds are
# purged of every date whose forward-label window can overlap a test date's window (Lopez de Prado
# purged K-fold); validation verdicts require genuinely independent out-of-fold evidence.
# Stage 11 - calibration feedback gate (research/70). INERT until cells are BOTH 68-approved and
# 69-oos-validated; then emits proposed expected_alpha_at_full updates for HUMAN review — it never
# edits this file. Production promotion additionally requires backtest/16 evidence + protocol note.
calibration_feedback:
  dir: "calibration_feedback"
  horizon_days: 252                         # slopes at this horizon feed the annualized proposal

# Stage 12 - orchestration (orchestration/18) + rule-based risk governor (orchestration/19).
# The governor emits a SHADOW directive only; nothing applies it until Stage 11 promotes it.
orchestration:
  step_timeout_sec: 1800
  macro_step_timeout_sec: 7200             # raw + full serving fits can legitimately exceed 30 minutes
  cadences:
    # earnings runs last: advisory-only (WARN on failure) and must never delay trading-critical stages
    tactical: [scores, risk, optimizer, costs, rotation, governor, final, earnings]
    strategic: [scores, risk, optimizer, costs, rotation, macro, bl, sleeves, ledger, exits, payout, governor, final, earnings]

# Stage 10 - payout / liability planner (SHADOW-ONLY; the +payout walk-forward arm is UNREGISTERED
# for the first Open Event per docs/LOCKBOX_PROTOCOL.md). Emits a per-run distribution PROPOSAL:
# cash buffer first, then bounded weakest-conviction harvest trims; never a forced liquidation of an
# intact thesis; never modifies the deployable book unless enabled_in_production is flipped via a
# dated protocol amendment AFTER a subsequent lockbox cycle validates it.
payout:
  enabled_in_production: false
  cadence: "quarterly"                     # protocol default: quarterly, range-based, buffer-funded
  target_payout_usd: 15000                 # per-event distribution target (protocol 2026-06-27 entry)
  payout_range_fraction: 0.20              # acceptable band: target * (1 +/- fraction)
  min_cash_buffer_fraction: 0.02           # post-payout CASH floor as a fraction of AUM
  harvest_max_per_name_fraction: 0.25      # max share of any single position harvested per event
  thesis_intact_ratings: [strong_buy, buy, hold]   # never fully liquidated solely to fund a payout

risk_governor:
  apply_directive: false                   # false = directive recorded as shadow in the final book;
                                           # flipping to true requires Stage 11 promotion evidence
  drawdown_window_trading_days: 63
  dd_limit: 0.15                            # trailing book drawdown that trips the circuit breaker
  dd_cut_multiplier: 0.5                    # gross multiplier while the breaker is tripped
  recovery_fraction: 0.5                    # re-risk only when dd <= dd_limit * this (hysteresis)
  risk_off_multiplier: 0.75                 # gross multiplier while regime is in risk_off_regimes
  # risk_off_regimes defaults to sleeves.risk_off_regimes

# Stage 11 - registered-arm net-of-cost walk-forward ablation (backtest/16). RESEARCH ONLY: this is
# the lockbox promotion evidence; promotion additionally requires 68/69 approvals and a dated
# protocol amendment. Arms replay allocation-level overlay rules over dev-window snapshots.
walkforward:
  dir: "walkforward"                       # under paths.output_dir; one subdir per panel build
  arms: [aqr_only, rotation, macro_bl, sleeves, regime_gate, regime_lever]
  # regime_gate (research/71 evidence): the AQR score-tilted book ONLY when the PIT macro regime is
  # supportive; otherwise the SAME optimizer with mu=0 (pure minimum-variance over the same universe).
  # A missing/unknown regime label is treated as unsupportive (fail closed). This is the net-of-cost
  # test of "trade the scores when the regime says they work, stand down otherwise."
  regime_gate_supportive_regimes: [HEATING_UP]
  # regime_lever uses the same supportive-regime gate, but multiplies mu inside supportive regimes
  # to test whether the conditional ranking signal can produce active return, not just lower vol.
  regime_lever_mu_multiplier: 1.5
  regime_lever_unsupported_mode: "min_var"  # min_var | cash | aqr
  regime_sweep:
    mu_multipliers: [1.25, 1.5, 2.0]
    rebalance_every_n_snapshots: [5, 21]
    unsupported_modes: [min_var, cash]
    familywise_alpha: 0.05                 # Bonferroni family-wise error rate across the full grid
  rebalance_every_n_snapshots: 5           # daily store -> weekly rebalance
  one_way_cost_bps: 5.0                    # flat one-way cost on traded weight at each rebalance
  cov_lookback_trading_days: 252
  cov_min_obs: 60
  max_universe: 150                        # top names by |mu| per rebalance (solver tractability)
  min_universe: 20                         # skip a rebalance below this
  min_days: 250                            # promotion floor: net holding days replayed
  min_independent_windows: 6               # promotion floor: non-overlapping 21d windows in span
  promote_net_ir_min: 0.0                  # net IR vs aqr_only must exceed this
  promote_active_t_min: 2.0                # Newey-West t-stat of daily net active returns must reach this
  active_t_hac_lag_days: 20                # overlap/serial-correlation correction for promotion inference
  lockbox_min_rebalances: 6                # one-time ledger refuses publication below this evidence floor

calibration_validation:
  dir: "calibration_validation"            # under paths.output_dir; one subdir per panel build
  n_folds: 5                               # chronologically contiguous test blocks
  embargo_extra_calendar_days: 0           # extra purge beyond the label window itself
  min_train_dates: 8                       # a fold trains only with this many surviving dates
  min_folds_valid: 3                       # verdict floor: folds that actually trained
  min_independent_test_windows: 3          # verdict floor: non-overlapping test label windows
  validate_t_min: 2.0                      # out-of-fold rank-IC t-stat must reach this

# Stage 11 - regime-conditional calibration validation (research/71; 68/69 extension).
# EVIDENCE ONLY: validated regime cells change nothing until a regime-conditional sizing design,
# a Stage 16 walk-forward arm, and a dated protocol amendment exist. Inherits fold/purge settings
# from calibration_validation; the approval bar sits above 69's because the regime grid multiplies
# the number of comparisons.
regime_calibration:
  dir: "regime_calibration"                # under paths.output_dir; one subdir per panel build
  regime_column: "macro_regime"            # PIT regime label joined by research/67
  min_regime_dates: 120                    # cells with fewer in-regime dates fail closed
  validate_t_min: 2.5                      # stricter than calibration_validation.validate_t_min

# Stage 11 - component-level purged forward IC (research/72). GATE 1 of the sector-neutral track:
# attribute which raw factor pillars predict forward returns out-of-sample, per sector/horizon/regime,
# and whether any pillar beats the diluting composite. EVIDENCE ONLY -- never edits scoring.
component_ic:
  dir: "component_ic"                      # under paths.output_dir; one subdir per panel build
  # Frozen, directionally consistent raw pillars used by research/72 and the 16c conversion test.
  # Every field is "higher is better"; risk/penalty/output scores are intentionally excluded.
  pillars_by_pipeline:
    semiconductors: [valuation_score, quality_score, risk_control_score, positioning_score, market_behavior_score, growth_score, sector_cycle_score]
    software_infrastructure: [valuation_score, quality_score, risk_control_score, positioning_score, market_behavior_score, growth_score]
    technology_hardware: [valuation_score, quality_score, risk_control_score, positioning_score, market_behavior_score, growth_score]
    defense: [valuation_score, quality_score, risk_control_score, positioning_score, market_behavior_score, growth_score, sector_cycle_score]
    biotech: [clinical_opportunity_score, commercial_value_score, commercial_quality_score, forward_catalyst_score, financial_quality_score, financial_survival_score, momentum_score, institutional_accumulation_score]
    med_devices: [fundamental_quality_score, durable_growth_alpha_score, fda_alpha_score, reimbursement_score, valuation_score, technical_alpha_score, institutional_accumulation_score, sentiment_catalyst_score]

# Stage 11 - six-sector single-name long/short conversion and promotion evidence (backtest/16c).
# This does not create a production target. It must first prove that both the spread and its short
# leg survive PIT execution, borrow, availability, commission, and conservative missing-data stress.
sector_neutral_arm:
  dir: "sector_neutral_arm"
  short_costs:
    mode: "pit"                            # pit | fixed; only pit can earn promotion
    market_positioning_db_path: "${MARKET_POSITIONING_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/market_positioning.sqlite}"
    research_aum_usd: 300000
    commission_per_order_usd: 1.25
    fixed_one_way_cost_bps: 5.0            # compatibility/self-test only; fixed mode is not promotable
    historical_half_spread_fallback_bps: 15.0
    missing_borrow_fee_annual: 0.10        # annual decimal; deliberately conservative
    max_borrow_fee_age_days: 7
    max_shortable_age_days: 7
    allow_fee_proxy_availability: true     # a same/prior-week IB fee observation is borrow evidence
    allow_unknown_availability: true       # allowed for research, but excluded from promotion coverage
    stress_half_spread_fallback_bps: 30.0
    stress_observed_spread_multiplier: 1.5
    stress_missing_borrow_fee_annual: 0.25
    stress_observed_borrow_multiplier: 1.5
  promotion:
    min_holding_days: 504
    min_independent_windows: 12            # feasible floor for a 126d horizon over the 2019-2025 dev window
    min_active_ir: 0.25
    min_active_t: 2.0
    min_short_net_ann: 0.0                  # short-name selection alpha vs equal-weight sector short
    min_stress_net_active_ann: 0.0
    min_positive_sectors: 4
    min_actual_borrow_weight_fraction: 0.90
    min_observed_or_fee_proxy_availability_weight_fraction: 0.90

# Stage 11 - dedicated EOD tactical single-name short replay (backtest/16e).
# Signal at D close, enter at the next session open, and return covered capital to CASH. This is a
# separate strategy from 16c and can never produce a target book unless every promotion gate passes.
tactical_short:
  dir: "tactical_short"
  tail_fraction: 0.10
  min_names_per_sector: 2
  max_names_per_sector: 10
  signal_every_n_snapshots: 5
  # Provisional only until 16f emits a sealed parameter artifact. This is a NET
  # return threshold after estimated round-trip execution and accrued borrow.
  net_profit_target: 0.03
  stop_loss: 0.05
  max_holding_days: 5
  invalidation_score_z: 0.0
  cooldown_days: 3
  target_short_gross: 0.30
  max_position_weight: 0.015
  max_borrow_fee_annual: 0.25
  short_costs:
    market_positioning_db_path: "${MARKET_POSITIONING_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/market_positioning.sqlite}"
    research_aum_usd: 300000
    commission_per_order_usd: 1.25
    historical_half_spread_fallback_bps: 15.0
    missing_borrow_fee_annual: 0.10
    max_borrow_fee_age_days: 7
    max_shortable_age_days: 7
    allow_fee_proxy_availability: true
    allow_unknown_availability: true
    stress_half_spread_fallback_bps: 30.0
    stress_observed_spread_multiplier: 1.5
    stress_missing_borrow_fee_annual: 0.25
    stress_observed_borrow_multiplier: 1.5
  promotion:
    min_trades: 500
    min_selection_alpha_ann: 0.0
    min_active_t: 2.0
    min_profit_factor: 1.10
    min_positive_sectors: 4
    min_stress_net_ann: 0.0
    min_actual_borrow_weight_fraction: 0.90
    min_observed_or_fee_proxy_availability_weight_fraction: 0.90
    min_candidate_execution_ohlcv_fraction: 0.95

# Stage 11 - nested, purged calibration of the tactical-short exit policy (16f).
# The grid is intentionally limited to economically interpretable neighboring
# values. Outer folds are untouched by parameter selection.
tactical_short_calibration:
  dir: "tactical_short_calibration"
  max_holding_days: [1, 2, 3, 5, 7]
  net_profit_targets: [0.005, 0.01, 0.02, 0.03]
  stop_losses: [0.03, 0.05]
  outer_folds: 4
  outer_initial_fraction: 0.50
  minimum_outer_train_dates: 252
  minimum_valid_outer_folds: 3
  inner_folds: 3
  inner_initial_fraction: 0.50
  minimum_inner_train_dates: 126
  embargo_trading_days: 2
  stability_penalty: 0.50
  min_parameter_fold_consistency: 0.50

# Stage 11 - dedicated long-only execution replay (backtest/16g). This does not replace the
# Stage 3/4 baseline. It tests whether the highest-ranked names add net selection alpha using
# executable D+1-open entries and first-threshold signal exits at the following open.
tactical_long:
  dir: "tactical_long"
  tail_fraction: 0.10
  min_names_per_sector: 2
  max_names_per_sector: 10
  signal_every_n_snapshots: 5
  max_holding_days: 30                  # provisional; 16h calibrates the sealed value
  invalidation_score_z: 0.0             # first close at/below neutral schedules next-open exit
  target_long_gross: 0.95
  max_position_weight: 0.05
  long_costs:
    market_positioning_db_path: "${MARKET_POSITIONING_DB_PATH:-C:/Users/josel/Documents/STAGING/DB/market_positioning.sqlite}"
    research_aum_usd: 300000
    commission_per_order_usd: 1.25
    historical_half_spread_fallback_bps: 15.0
    stress_half_spread_fallback_bps: 30.0
    stress_observed_spread_multiplier: 1.5
  # Core gates deliberately match tactical_short.promotion. Borrow and availability
  # gates are side-specific and therefore remain short-only.
  promotion:
    min_trades: 500
    min_selection_alpha_ann: 0.0
    min_active_t: 2.0
    min_profit_factor: 1.10
    min_positive_sectors: 4
    min_stress_net_ann: 0.0
    min_candidate_execution_ohlcv_fraction: 0.95

# Stage 11 - nested, purged calibration of the long-only holding horizon (backtest/16h).
# No profit target or price stop is fitted; a position exits on the first signal
# invalidation or at the selected maximum horizon.
tactical_long_calibration:
  dir: "tactical_long_calibration"
  max_holding_days: [15, 30, 63, 126, 252]
  outer_folds: 4
  outer_initial_fraction: 0.50
  minimum_outer_train_dates: 126
  minimum_valid_outer_folds: 3
  inner_folds: 3
  inner_initial_fraction: 0.50
  minimum_inner_train_dates: 126
  embargo_signal_dates: 2
  stability_penalty: 0.50
  min_parameter_fold_consistency: 0.50

# Stage 11 - rank-reconstitution long research (16i/16j). This is deliberately
# separate from the fixed-entry 16g/16h baseline. Incumbents enter inside the
# configured percentile and leave only after breaching a 10-point wider rank
# buffer, becoming ineligible, hitting the time stop, or losing execution data.
rank_reconstitution_long:
  dir: "rank_reconstitution_long"
  entry_fraction: 0.10
  exit_fraction: 0.20
  max_holding_days: 126
  regime_mode: "unconditional"            # unconditional | v1_gate | h1_gate
  supportive_regimes: [HEATING_UP]
  signal_every_n_snapshots: 5
  minimum_names_per_sector: 2
  absolute_max_names_per_sector: 200       # safety only; economic count is tighter when commissions bind
  target_long_gross: 0.95
  max_position_weight: 0.05
  long_costs:
    research_aum_usd: 300000
    commission_per_order_usd: 1.25
    historical_half_spread_fallback_bps: 15.0
    stress_half_spread_fallback_bps: 30.0
    stress_observed_spread_multiplier: 1.5

# Factorized nested comparison: select the holding horizon separately for the
# top-10% and top-20% structures using unconditional training data, then test
# each structure under all three pre-registered regime treatments on the same
# untouched outer dates. Raw trade count is diagnostic, not a promotion gate.
rank_reconstitution_calibration:
  dir: "rank_reconstitution_calibration"
  entry_fractions: [0.10, 0.20]
  max_holding_days: [15, 30, 63, 126, 252]
  regime_modes: [unconditional, v1_gate, h1_gate]
  outer_folds: 4
  outer_initial_fraction: 0.50
  minimum_outer_train_dates: 126
  minimum_valid_outer_folds: 3
  inner_folds: 3
  inner_initial_fraction: 0.50
  minimum_inner_train_dates: 126
  embargo_signal_dates: 2
  stability_penalty: 0.50
  bootstrap_confidence: 0.90
  bootstrap_replications: 1000
  bootstrap_seed: 1729
  minimum_oos_years: 3.0
  minimum_positive_sectors: 4
  minimum_execution_coverage: 0.95
  parallel_replays: 2                    # bounded I/O/memory concurrency; results are reordered deterministically
